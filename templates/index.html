function filterProcs(cat) {
  _procFilter = cat;
  // update filter buttons
  document.querySelectorAll('.legal-filter-btn').forEach(function(b) {
    b.classList.remove('active');
    if (cat === 'alle' && b.textContent.trim().indexOf('Alle') !== -1) b.classList.add('active');
    else if (b.textContent.trim().toLowerCase().indexOf(cat.replace('_',' ')) !== -1) b.classList.add('active');
  });
  loadProcedures();
}

function scrollToProc(type) {
  var el = document.getElementById('proc-' + type);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // briefly expand it
    if (!el.classList.contains('expanded')) {
      el.classList.add('expanded');
    }
  }
}

function toggleProcCard(type) {
  var el = document.getElementById('proc-' + type);
  if (el) el.classList.toggle('expanded');
}

function loadProcedures() {
  apiFetch('/procedures', function(err, data) {
    var el = document.getElementById('procList');
    if (!el) return;
    if (err) { el.innerHTML = '<p style="color:var(--red)">Fout bij laden: ' + esc(err) + '</p>'; return; }

    // Group by categorie
    var cats = { bestuursrecht: [], civiel_recht: [], strafrecht: [], europees: [] };
    var catNames = { bestuursrecht: 'Bestuursrecht', civiel_recht: 'Civiel recht', strafrecht: 'Strafrecht', europees: 'Europees / Internationaal' };
    var catIcons = { bestuursrecht: 'account_balance', civiel_recht: 'description', strafrecht: 'report', europees: 'public' };
    var catColors = { bestuursrecht: '#3b82f6', civiel_recht: '#10b981', strafrecht: '#ef4444', europees: '#dc2626' };
    var catDescs = {
      bestuursrecht: 'Procedures tegen de overheid — Algemene wet bestuursrecht (Awb)',
      civiel_recht: 'Geschillen tussen burgers/bedrijven onderling — Wetboek van Burgerlijke Rechtsvordering (Rv)',
      strafrecht: 'Strafbare feiten — Wetboek van Strafvordering (Sv)',
      europees: 'Europees Hof voor de Rechten van de Mens — als alle nationale rechtsmiddelen zijn uitgeput'
    };

    data.forEach(function(p) {
      var cat = p.categorie || 'bestuursrecht';
      if (cats[cat]) cats[cat].push(p);
    });

    var h = '';
    // EHRM apart categoriseren
    data.forEach(function(p) {
      if (p.type === 'ehrm') {
        cats['europees'] = cats['europees'] || [];
        cats['europees'].push(p);
        // Verwijder uit bestuursrecht
        cats['bestuursrecht'] = (cats['bestuursrecht'] || []).filter(function(x) { return x.type !== 'ehrm'; });
      }
    });
    var catOrder = ['bestuursrecht', 'civiel_recht', 'strafrecht', 'europees'];
    catOrder.forEach(function(cat) {
      if (_procFilter !== 'alle' && _procFilter !== cat) return;
      var procs = cats[cat];
      if (!procs || procs.length === 0) return;

      // Category header
      h += '<div class="legal-cat-section">';
      h += '<div class="legal-cat-header">';
      h += '<div class="legal-cat-icon" style="background:' + catColors[cat] + '"><span class="mi">' + catIcons[cat] + '</span></div>';
      h += '<div><h2>' + catNames[cat] + '</h2><div style="font-size:12px;color:var(--tx3)">' + catDescs[cat] + '</div></div>';
      h += '<span class="badge" style="background:rgba(148,163,184,.1);color:var(--tx2)">' + procs.length + ' procedures</span>';
      h += '</div>';

      // Procedure cards
      procs.forEach(function(p) {
        h += buildProcCard(p);
      });

      h += '</div>'; // legal-cat-section
    });

    if (!h) h = '<div class="empty-state"><span class="mi">search_off</span><p>Geen procedures gevonden voor dit filter.</p></div>';

    el.innerHTML = h;
  });
}

function buildProcCard(p) {
  var kleur = p.kleur || 'var(--accent)';
  var icon = p.icon || 'gavel';

  var h = '<div class="legal-card" id="proc-' + esc(p.type) + '">';

  // Clickable header
  h += '<div class="legal-card-top" onclick="toggleProcCard(\'' + esc(p.type) + '\')">';
  h += '<div class="legal-card-icon" style="background:' + kleur + '"><span class="mi">' + icon + '</span></div>';
  h += '<div class="legal-card-info">';
  h += '<h3>' + esc(p.naam) + '</h3>';
  h += '<div class="legal-sub">';
  h += '<span><span class="mi">book</span> ' + esc(p.wettelijke_basis) + '</span>';
  h += '<span><span class="mi">schedule</span> ' + esc(p.termijn) + '</span>';
  if (p.kosten) h += '<span><span class="mi">payments</span> ' + esc(p.kosten).substring(0, 50) + '</span>';
  h += '</div>';
  h += '</div>';
  h += '<span class="mi legal-card-chevron">expand_more</span>';
  h += '</div>';

  // Expandable body
  h += '<div class="legal-card-body">';

  // Short description
  h += '<div class="legal-section" style="background:rgba(59,130,246,.03)">';
  h += '<p style="font-size:14px;color:var(--tx);font-weight:500">' + esc(p.beschrijving) + '</p>';
  if (p.wanneer) {
    h += '<div style="margin-top:10px"><h4 style="font-size:12px;margin-bottom:4px"><span class="mi">help</span> Wanneer gebruiken?</h4>';
    h += '<p>' + esc(p.wanneer) + '</p></div>';
  }
  h += '</div>';

  // Uitleg (main legal explanation)
  if (p.uitleg) {
    h += '<div class="legal-section">';
    h += '<h4><span class="mi">menu_book</span> Hoe werkt het?</h4>';
    h += '<div class="legal-text">' + esc(p.uitleg) + '</div>';
    h += '</div>';
  }

  // Stappen (visual flow)
  if (p.stappen && p.stappen.length) {
    h += '<div class="legal-section">';
    h += '<h4><span class="mi">format_list_numbered</span> Stappen</h4>';
    h += '<div class="legal-steps-flow">';
    p.stappen.forEach(function(s, i) {
      h += '<div class="legal-step">';
      h += '<div class="legal-step-num" style="background:' + kleur + '">' + (i + 1) + '</div>';
      h += '<div class="legal-step-text">' + esc(s) + '</div>';
      h += '</div>';
    });
    h += '</div>';
    if (p.vervolg) {
      h += '<div style="margin-top:10px;padding:8px 12px;background:var(--bg2);border-radius:var(--rs);font-size:12px;color:var(--tx2)">';
      h += '<span class="mi mi-sm" style="color:var(--accent)">arrow_forward</span> <strong>Vervolg:</strong> ' + esc(p.vervolg);
      h += '</div>';
    }
    h += '</div>';
  }

  // Vereisten
  if (p.vereisten && p.vereisten.length) {
    h += '<div class="legal-section">';
    h += '<h4><span class="mi">checklist</span> Vereisten</h4>';
    h += '<ul>';
    p.vereisten.forEach(function(v) { h += '<li>' + esc(v) + '</li>'; });
    h += '</ul>';
    h += '</div>';
  }

  // Wetsartikelen
  if (p.wetsartikelen && p.wetsartikelen.length) {
    h += '<div class="legal-section">';
    h += '<h4><span class="mi">balance</span> Relevante wetsartikelen</h4>';
    h += '<div class="legal-articles">';
    p.wetsartikelen.forEach(function(a) {
      h += '<div class="legal-article">';
      h += '<span class="legal-article-ref">' + esc(a.artikel) + '</span>';
      h += '<span class="legal-article-desc">' + esc(a.inhoud) + '</span>';
      h += '</div>';
    });
    h += '</div>';
    h += '</div>';
  }

  // Kosten & instantie
  if (p.kosten || p.instantie) {
    h += '<div class="legal-section">';
    h += '<h4><span class="mi">info</span> Praktisch</h4>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
    if (p.kosten) {
      h += '<div style="font-size:13px"><strong style="color:var(--tx)">Kosten:</strong><br><span style="color:var(--tx2)">' + esc(p.kosten) + '</span></div>';
    }
    if (p.instantie) {
      h += '<div style="font-size:13px"><strong style="color:var(--tx)">Bij wie indienen:</strong><br><span style="color:var(--tx2)">' + esc(p.instantie) + '</span></div>';
    }
    h += '</div>';
    h += '</div>';
  }

  // Tips
  if (p.tips && p.tips.length) {
    h += '<div class="legal-section">';
    h += '<h4><span class="mi">lightbulb</span> Tips</h4>';
    h += '<div class="legal-tips">';
    p.tips.forEach(function(t) {
      h += '<div class="legal-tip"><span class="mi">lightbulb</span> ' + esc(t) + '</div>';
    });
    h += '</div>';
    h += '</div>';
  }

  h += '</div>'; // legal-card-body
  h += '</div>'; // legal-card

  return h;
}

// ---- E-MAILS PAGINA ----
var _emailPage = 1;
var _emailFilter = {};

function pgEmails() {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  // Laad stats + zaken parallel
  var stats = null, zaken = null;
  var done = 0;
  function check() {
    done++;
    if (done >= 2) renderEmailPage(stats, zaken);
  }
  apiFetch('/emails/stats', function(err, data) { stats = data || {}; check(); });
  apiFetch('/zaken', function(err, data) { zaken = data || []; check(); });
}

function renderEmailPage(stats, zaken) {
  var app = document.getElementById('app');
  var h = '<div class="section-title"><span class="mi">email</span> E-mails</div>';

  // Stats cards
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px">';
  h += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--accent)">' + (stats.total || 0) + '</div><div style="font-size:12px;color:var(--tx3)">Totaal</div></div>';
  h += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--green)">' + (stats.linked || 0) + '</div><div style="font-size:12px;color:var(--tx3)">Gekoppeld</div></div>';
  h += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--yellow)">' + (stats.unlinked || 0) + '</div><div style="font-size:12px;color:var(--tx3)">Ongekoppeld</div></div>';
  h += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--blue)">' + (stats.inkomend || 0) + '</div><div style="font-size:12px;color:var(--tx3)">Inkomend</div></div>';
  h += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--purple)">' + (stats.uitgaand || 0) + '</div><div style="font-size:12px;color:var(--tx3)">Uitgaand</div></div>';
  h += '</div>';

  // Action buttons
  h += '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">';
  h += '<button class="btn btn-blue btn-sm" onclick="syncEmails()"><span class="mi">sync</span> Synchroniseer vanuit Outlook</button>';
  h += '<button class="btn btn-green btn-sm" onclick="autoLinkEmails()"><span class="mi">link</span> Auto-koppel aan zaken</button>';
  h += '</div>';

  // Search + filter bar
  h += '<div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
  h += '<input id="emailSearch" type="text" placeholder="Zoek in e-mails..." style="flex:1;min-width:200px;background:var(--bg);border:1px solid var(--glass-bd);border-radius:var(--rs);padding:8px 12px;color:var(--tx);font:13px var(--font)" onkeydown="if(event.key===\'Enter\')searchEmails()">';
  h += '<select id="emailZaakFilter" style="background:var(--bg);border:1px solid var(--glass-bd);border-radius:var(--rs);padding:8px;color:var(--tx);font:13px var(--font)">';
  h += '<option value="">Alle zaken</option>';
  h += '<option value="__unlinked">Ongekoppeld</option>';
  (zaken || []).forEach(function(z) {
    h += '<option value="' + z.id + '">' + esc(z.naam) + '</option>';
  });
  h += '</select>';
  h += '<select id="emailRichtingFilter" style="background:var(--bg);border:1px solid var(--glass-bd);border-radius:var(--rs);padding:8px;color:var(--tx);font:13px var(--font)">';
  h += '<option value="">Alle richtingen</option><option value="inkomend">Inkomend</option><option value="uitgaand">Uitgaand</option>';
  h += '</select>';
  h += '<button class="btn btn-blue btn-sm" onclick="searchEmails()"><span class="mi">search</span></button>';
  h += '</div>';

  // Email list placeholder
  h += '<div id="emailList"><div class="loading"><div class="spinner"></div></div></div>';
  h += '<div id="emailPagination" style="margin-top:12px;display:flex;gap:8px;justify-content:center"></div>';

  app.innerHTML = h;
  _emailPage = 1;
  _emailFilter = {};
  loadEmailList();
}

function searchEmails() {
  _emailPage = 1;
  _emailFilter = {};
  var q = document.getElementById('emailSearch');
  var zaak = document.getElementById('emailZaakFilter');
  var richting = document.getElementById('emailRichtingFilter');
  if (q && q.value) _emailFilter.q = q.value;
  if (zaak && zaak.value === '__unlinked') _emailFilter.unlinked = '1';
  else if (zaak && zaak.value) _emailFilter.zaak_id = zaak.value;
  if (richting && richting.value) _emailFilter.richting = richting.value;
  loadEmailList();
}

function loadEmailList() {
  var el = document.getElementById('emailList');
  if (!el) return;
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  var params = 'page=' + _emailPage + '&per_page=30';
  if (_emailFilter.q) params += '&q=' + encodeURIComponent(_emailFilter.q);
  if (_emailFilter.zaak_id) params += '&zaak_id=' + encodeURIComponent(_emailFilter.zaak_id);
  if (_emailFilter.richting) params += '&richting=' + encodeURIComponent(_emailFilter.richting);
  if (_emailFilter.unlinked) params += '&unlinked=1';

  apiFetch('/emails?' + params, function(err, data) {
    if (err || !data) { el.innerHTML = '<p style="color:var(--tx3)">Fout bij laden</p>'; return; }

    if (!data.emails || !data.emails.length) {
      el.innerHTML = '<div class="card" style="padding:32px;text-align:center;color:var(--tx3)">' +
        '<span class="mi" style="font-size:48px;display:block;margin-bottom:8px">mail</span>' +
        '<p>Geen e-mails gevonden.</p>' +
        '<p style="font-size:12px">Klik op "Synchroniseer vanuit Outlook" om je e-mails op te halen.</p></div>';
      return;
    }

    var h = '';
    data.emails.forEach(function(em) {
      var richtingIcon = em.richting === 'uitgaand' ? '<span class="mi" style="color:var(--purple);font-size:14px" title="Uitgaand">north_east</span>' : '<span class="mi" style="color:var(--blue);font-size:14px" title="Inkomend">south_west</span>';
      var zaakBadge = em.zaak_naam ? '<span class="badge badge-green" style="font-size:10px">' + esc(em.zaak_naam) + '</span>' : '<span class="badge" style="font-size:10px;background:var(--glass);color:var(--tx3)">ongekoppeld</span>';
      var datumStr = em.datum_str || '';
      var bijlagenIcon = em.heeft_bijlagen ? ' <span class="mi" style="font-size:13px;color:var(--tx3)" title="Bijlagen">attach_file</span>' : '';

      h += '<div class="card" style="margin-bottom:6px;padding:10px 16px;cursor:pointer" onclick="go(\'/email/' + em.id + '\')">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">';
      h += richtingIcon;
      h += '<span style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(em.onderwerp || '(geen onderwerp)') + '</span>';
      h += bijlagenIcon;
      h += '</div>';
      h += '<div style="font-size:12px;color:var(--tx3)">';
      h += '<span>' + esc(em.van_naam || em.van_email || '') + '</span>';
      if (em.aan && em.aan.length) h += ' <span class="mi" style="font-size:11px">arrow_forward</span> <span>' + esc(em.aan[0]) + (em.aan.length > 1 ? ' +' + (em.aan.length-1) : '') + '</span>';
      h += '</div>';
      h += '</div>';
      h += '<div style="text-align:right;flex-shrink:0">';
      h += '<div style="font-size:11px;color:var(--tx3)">' + datumStr + '</div>';
      h += '<div style="margin-top:4px">' + zaakBadge + '</div>';
      h += '</div>';
      h += '</div>';
      if (em.body_preview) h += '<div style="font-size:11px;color:var(--tx3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(em.body_preview.substring(0, 150)) + '</div>';
      h += '</div>';
    });
    el.innerHTML = h;

    // Pagination
    var pg = document.getElementById('emailPagination');
    if (pg && data.pages > 1) {
      var ph = '';
      if (_emailPage > 1) ph += '<button class="btn btn-ghost btn-sm" onclick="_emailPage--;loadEmailList()">Vorige</button>';
      ph += '<span style="font-size:12px;color:var(--tx3);padding:6px">Pagina ' + data.page + ' van ' + data.pages + ' (' + data.total + ' e-mails)</span>';
      if (_emailPage < data.pages) ph += '<button class="btn btn-ghost btn-sm" onclick="_emailPage++;loadEmailList()">Volgende</button>';
      pg.innerHTML = ph;
    } else if (pg) {
      pg.innerHTML = '<span style="font-size:12px;color:var(--tx3)">' + data.total + ' e-mails</span>';
    }
  });
}

function syncEmails() {
  toast('E-mails synchroniseren vanuit Outlook...');
  apiFetch('/emails/sync', { method: 'POST', body: {} }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (data && data.error ? data.error : err || 'Onbekende fout')); return; }
    toast(data.new_saved + ' nieuwe e-mails opgeslagen, ' + data.total_in_db + ' totaal in database');
    pgEmails();
  });
}

function autoLinkEmails() {
  toast('E-mails automatisch koppelen aan zaken...');
  apiFetch('/emails/auto-link', { method: 'POST' }, function(err, data, ok) {

// ---- E-MAIL DETAIL PAGINA ----
function pgEmailDetail(emailId) {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  var emailData = null, zakenData = null;
  var done = 0;
  function check() {
    done++;
    if (done >= 2) renderEmailDetail(emailData, zakenData);
  }
  apiFetch('/emails/' + emailId, function(err, data) { emailData = data; check(); });
  apiFetch('/zaken', function(err, data) { zakenData = data || []; check(); });
}

function renderEmailDetail(em, zaken) {
  var app = document.getElementById('app');
  if (!em || em.error) { app.innerHTML = '<p>E-mail niet gevonden</p>'; return; }

  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h += '<div class="section-title" style="margin-bottom:0"><span class="mi">email</span> ' + esc(em.onderwerp || '(geen onderwerp)') + '</div>';
  h += '<button class="btn btn-ghost btn-sm" onclick="go(\'/emails\')">Terug</button>';
  h += '</div>';

  // Meta info card
  h += '<div class="card" style="padding:16px;margin-bottom:16px">';
  h += '<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px">';
  h += '<span style="color:var(--tx3)">Van:</span><span><strong>' + esc(em.van_naam || '') + '</strong> &lt;' + esc(em.van_email || '') + '&gt;</span>';
  h += '<span style="color:var(--tx3)">Aan:</span><span>' + esc((em.aan || []).join(', ')) + '</span>';
  if (em.cc && em.cc.length) h += '<span style="color:var(--tx3)">CC:</span><span>' + esc(em.cc.join(', ')) + '</span>';
  h += '<span style="color:var(--tx3)">Datum:</span><span>' + esc(em.datum_str || '') + '</span>';
  h += '<span style="color:var(--tx3)">Richting:</span><span>' + (em.richting === 'uitgaand' ? '<span class="mi" style="font-size:14px;color:var(--purple)">north_east</span> Uitgaand' : '<span class="mi" style="font-size:14px;color:var(--blue)">south_west</span> Inkomend') + '</span>';
  if (em.heeft_bijlagen) h += '<span style="color:var(--tx3)">Bijlagen:</span><span><span class="mi" style="font-size:14px">attach_file</span> Ja</span>';
  h += '</div>';
  h += '</div>';

  // Zaak koppeling
  h += '<div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
  h += '<span style="font-size:13px;color:var(--tx3)"><span class="mi" style="font-size:16px">link</span> Zaak:</span>';
  h += '<select id="emailZaakLink" style="background:var(--bg);border:1px solid var(--glass-bd);border-radius:var(--rs);padding:6px 10px;color:var(--tx);font:13px var(--font);flex:1;min-width:200px">';
  h += '<option value="">— Niet gekoppeld —</option>';
  (zaken || []).forEach(function(z) {
    h += '<option value="' + z.id + '"' + (em.zaak_id === z.id ? ' selected' : '') + '>' + esc(z.naam) + '</option>';
  });
  h += '</select>';
  h += '<button class="btn btn-blue btn-sm" onclick="linkEmailToZaak(\'' + em.id + '\')"><span class="mi">save</span> Opslaan</button>';
  h += '</div>';

  // Body
  h += '<div class="card" style="padding:16px">';
  if (em.body_html) {
    h += '<div style="font-size:13px;line-height:1.6;max-height:600px;overflow-y:auto" class="email-body-html">' + em.body_html + '</div>';
  } else if (em.body_text) {
    h += '<pre style="font-size:12px;line-height:1.5;white-space:pre-wrap;color:var(--tx2);max-height:600px;overflow-y:auto">' + esc(em.body_text) + '</pre>';
  } else {
    h += '<p style="color:var(--tx3)">Geen inhoud beschikbaar</p>';

  h += '</div>';

  app.innerHTML = h;
}

function linkEmailToZaak(emailId) {
  var sel = document.getElementById('emailZaakLink');
  var zaakId = sel ? sel.value : '';
  apiFetch('/emails/' + emailId + '/link', { method: 'POST', body: { zaak_id: zaakId } }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (data && data.error ? data.error : err)); return; }
    toast(zaakId ? 'E-mail gekoppeld aan zaak' : 'E-mail ontkoppeld');
    pgEmailDetail(emailId);
  });
}

function toggleMigAuth() {
  var auth = document.getElementById('migAuth').value;
  document.getElementById('migSqlAuth').style.display = auth === 'sql' ? 'block' : 'none';
}

function getMigConfig() {
  return {
    server: document.getElementById('migServer').value,
    database: document.getElementById('migDatabase').value,
    auth_type: document.getElementById('migAuth').value,
    username: (document.getElementById('migUser') || {}).value || '',
    password: (document.getElementById('migPass') || {}).value || '',
  };
}

function checkMigrateReqs() {
  var el = document.getElementById('migDriverInfo');
  if (!el) return;
  el.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span> Controleren...';
  apiFetch('/migrate/check', function(err, data) {
    if (err) { el.innerHTML = '<p style="color:var(--red);font-size:12px">Fout: ' + esc(err) + '</p>'; return; }
    var h = '';
    if (data.ready) {
      h += '<div style="font-size:12px;color:var(--green);padding:8px 12px;background:var(--green-soft);border-radius:var(--rs)">';
      h += '<span class="mi mi-sm">check_circle</span> Klaar voor migratie. ';
      if (data.odbc_drivers && data.odbc_drivers.length) {
        var sqlDrivers = data.odbc_drivers.filter(function(d){ return d.indexOf('SQL Server') !== -1; });
        h += 'ODBC drivers: ' + sqlDrivers.join(', ');
      }
      h += '</div>';
    } else {
      h += '<div style="font-size:12px;color:var(--red);padding:8px 12px;background:var(--red-soft);border-radius:var(--rs)">';
      h += '<span class="mi mi-sm">error</span> Niet gereed:<br>';
      data.issues.forEach(function(i) { h += '&bull; ' + esc(i) + '<br>'; });
      h += '</div>';
    }
    el.innerHTML = h;
  });
}

function testMigrateConn() {
  var el = document.getElementById('migResults');
  el.innerHTML = '<span class="spinner"></span> Verbinding testen...';
  apiFetch('/migrate/test', { method: 'POST', body: getMigConfig() }, function(err, data) {
    if (err) { el.innerHTML = '<p style="color:var(--red);font-size:13px">Fout: ' + esc(err) + '</p>'; return; }
    if (data.success) {
      el.innerHTML = '<div class="card" style="padding:12px 16px;border-color:var(--green)">' +
        '<div style="font-size:13px;color:var(--green);margin-bottom:4px"><span class="mi mi-sm">check_circle</span> Verbinding geslaagd!</div>' +
        '<div style="font-size:12px;color:var(--tx2)">' + esc(data.version) + '</div>' +
        '<div style="font-size:12px;color:var(--tx3)">Database: ' + esc(data.database) + '</div>' +
        '</div>';
    } else {
      el.innerHTML = '<div class="card" style="padding:12px 16px;border-color:var(--red)">' +
        '<div style="font-size:13px;color:var(--red)"><span class="mi mi-sm">error</span> Verbinding mislukt</div>' +
        '<div style="font-size:12px;color:var(--tx2);margin-top:4px">' + esc(data.error) + '</div>' +
        '</div>';
    }
  });
}

function startMigration() {
  if (!confirm('Weet u zeker dat u de migratie wilt starten?\n\nDit kopieert alle data naar SQL Server.\nBestaande tabellen in de SQL Server database worden overschreven.\nDe lokale SQLite database blijft ongewijzigd als backup.')) return;

  var el = document.getElementById('migResults');
  el.innerHTML = '<div style="text-align:center;padding:24px"><div class="spinner" style="width:32px;height:32px;border-width:3px"></div><div style="margin-top:12px;font-size:13px;color:var(--tx2)">Migratie bezig... Dit kan even duren.</div></div>';

  apiFetch('/migrate/start', { method: 'POST', body: getMigConfig() }, function(err, data) {
    if (err) { el.innerHTML = '<p style="color:var(--red);font-size:13px">Fout: ' + esc(err) + '</p>'; return; }

    var h = '<div class="card" style="padding:16px 20px">';
    if (data.success) {
      h += '<div style="font-size:15px;font-weight:700;color:var(--green);margin-bottom:12px"><span class="mi">check_circle</span> Migratie geslaagd!</div>';
      h += '<div style="font-size:13px;color:var(--tx2);margin-bottom:8px">Totaal ' + data.total_rows + ' rijen gekopieerd.</div>';
    } else {
      h += '<div style="font-size:15px;font-weight:700;color:var(--red);margin-bottom:12px"><span class="mi">error</span> Migratie mislukt</div>';
    }

    // Per-table results
    if (data.tables) {
      h += '<table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:8px">';
      h += '<tr style="color:var(--tx3);text-align:left"><th style="padding:6px 8px">Tabel</th><th style="padding:6px 8px">Rijen</th><th style="padding:6px 8px">Status</th></tr>';
      Object.keys(data.tables).forEach(function(t) {
        var info = data.tables[t];
        var color = info.status === 'ok' ? 'var(--green)' : info.status === 'leeg' ? 'var(--tx3)' : 'var(--red)';
        h += '<tr><td style="padding:6px 8px;color:var(--tx)">' + esc(t) + '</td>';
        h += '<td style="padding:6px 8px;color:var(--tx2)">' + info.rows + '</td>';
        h += '<td style="padding:6px 8px;color:' + color + '">' + esc(info.status) + '</td></tr>';
      });
      h += '</table>';
    }

    // Errors
    if (data.errors && data.errors.length) {
      h += '<div style="margin-top:12px;padding:8px 12px;background:var(--red-soft);border-radius:var(--rs);font-size:12px;color:var(--red)">';
      h += '<strong>Fouten:</strong><br>';
      data.errors.forEach(function(e) { h += '&bull; ' + esc(e) + '<br>'; });
      h += '</div>';
    }

    h += '</div>';
    el.innerHTML = h;
  });
}

function exportSqlDump() {
  var el = document.getElementById('migResults');
  el.innerHTML = '<span class="spinner"></span> Exporteren...';
  apiFetch('/migrate/export', { method: 'POST' }, function(err, data) {
    if (err) { el.innerHTML = '<p style="color:var(--red);font-size:13px">Fout: ' + esc(err) + '</p>'; return; }
    if (data.ok) {
      el.innerHTML = '<div class="card" style="padding:12px 16px;border-color:var(--green)">' +
        '<div style="font-size:13px;color:var(--green)"><span class="mi mi-sm">check_circle</span> SQL dump geexporteerd!</div>' +
        '<div style="font-size:12px;color:var(--tx2);margin-top:4px">Bestand: ' + esc(data.file) + '</div>' +
        '</div>';
    } else {
      el.innerHTML = '<p style="color:var(--red);font-size:13px">Fout: ' + esc(data.error) + '</p>';
    }
  });
}

function saveSettings() {
  apiFetch('/settings', { method: 'PUT', body: {
    ollama_url: document.getElementById('setOllamaUrl').value,
    ollama_model: document.getElementById('setOllamaModel').value,
    ai_provider: document.getElementById('setProvider').value,

  }}, function(err, data, ok) {
    if (err || !ok) { toast('Fout bij opslaan'); return; }

function testConnections() {
  var el = document.getElementById('testResults');
  el.innerHTML = '<div class="spinner"></div> Testen...';
  apiFetch('/health', function(err, h) {

    lines.push('<span class="status-dot ' + (h.document_processing.pdf?'dot-green':'dot-red') + '"></span> <strong>PDF:</strong> ' + (h.document_processing.pdf ? 'OK' : 'pdfplumber niet geinstalleerd'));
    lines.push('<span class="status-dot ' + (h.document_processing.ocr?'dot-green':'dot-red') + '"></span> <strong>OCR:</strong> ' + (h.document_processing.ocr ? 'OK' + (h.document_processing.tesseract_nld ? ' (NL)' : ' (geen NL taal)') : 'Tesseract niet geinstalleerd'));

// ---- OUTLOOK KOPPELING ----
var _outlookAbortCtrl = null;

function loadOutlookStatus() {
  var statusEl = document.getElementById('outlookStatus');
  var actionsEl = document.getElementById('outlookActions');
  if (!statusEl || !actionsEl) return;

  statusEl.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span>';
  actionsEl.innerHTML = '';

  apiFetch('/outlook/status', function(err, data, ok) {
    if (err || !ok) {
      statusEl.innerHTML = '<div style="font-size:12px;color:var(--tx3)">Kon Outlook status niet ophalen</div>';
      return;
    }

    if (data.connected) {
      var profile = data.profile || {};
      statusEl.innerHTML = '<div style="padding:10px 14px;background:var(--green-soft);border-radius:var(--rs);font-size:12px">' +
        '<span class="status-dot dot-green"></span> <strong>Verbonden</strong>' +
        (profile.name ? ' als ' + esc(profile.name) : '') +
        (profile.email ? ' (' + esc(profile.email) + ')' : '') + '</div>';
      actionsEl.innerHTML = '<button class="btn btn-ghost btn-sm" onclick="disconnectOutlook()"><span class="mi">link_off</span> Ontkoppelen</button>';
    } else if (!data.has_client_id) {
      statusEl.innerHTML = '<div style="padding:10px 14px;background:var(--yellow-soft);border-radius:var(--rs);font-size:12px">' +
        '<span class="status-dot dot-yellow"></span> Vul eerst een Client ID in en sla op. ' +
        '<a href="https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade" target="_blank" style="color:var(--accent)">Azure Portal &rarr;</a></div>';
      actionsEl.innerHTML = '';
    } else {
      statusEl.innerHTML = '<div style="padding:10px 14px;background:rgba(148,163,184,.08);border-radius:var(--rs);font-size:12px">' +
        '<span class="status-dot dot-gray"></span> Niet verbonden</div>';
      actionsEl.innerHTML = '<button class="btn btn-blue btn-sm" onclick="startOutlookAuth()"><span class="mi">login</span> Koppel Outlook</button>';
    }
  });
}

function startOutlookAuth() {
  var flowEl = document.getElementById('outlookDeviceFlow');
  if (!flowEl) return;
  flowEl.style.display = 'block';
  flowEl.innerHTML = '<div class="card" style="padding:16px;border-color:var(--accent)">' +
    '<div class="spinner" style="margin:0 auto"></div>' +
    '<p style="text-align:center;font-size:12px;color:var(--tx2);margin-top:8px">Device code ophalen...</p></div>';

  apiFetch('/outlook/auth/start', { method: 'POST' }, function(err, data, ok) {
    if (err || !ok || data.error) {
      flowEl.innerHTML = '<div class="card" style="padding:16px;border-color:var(--red)">' +
        '<p style="color:var(--red);font-size:13px"><span class="mi mi-sm">error</span> ' + esc(err || data.error || 'Onbekende fout') + '</p>' +
        '<p style="font-size:11px;color:var(--tx3);margin-top:6px">Controleer of de Client ID klopt en sla eerst de instellingen op.</p></div>';
      return;
    }

    var code = data.user_code || '???';
    var uri = data.verification_uri || 'https://microsoft.com/devicelogin';

    var h = '<div class="card" style="padding:20px;border-color:var(--accent);text-align:center">';
    h += '<h4 style="font-size:14px;margin-bottom:12px"><span class="mi" style="color:var(--accent)">devices</span> Inloggen bij Microsoft</h4>';
    h += '<p style="font-size:13px;color:var(--tx2);margin-bottom:16px">Open de link hieronder en voer de code in:</p>';
    h += '<div style="background:var(--bg2);border:2px dashed var(--accent);border-radius:var(--rs);padding:20px;margin-bottom:16px">';
    h += '<div style="font-size:32px;font-weight:800;letter-spacing:4px;color:var(--accent)">' + esc(code) + '</div>';
    h += '</div>';
    h += '<a href="' + esc(uri) + '" target="_blank" class="btn btn-blue" style="margin-bottom:12px"><span class="mi">open_in_new</span> ' + esc(uri) + '</a>';
    h += '<div id="deviceFlowStatus" style="margin-top:12px">';
    h += '<div class="spinner" style="width:16px;height:16px;display:inline-block;vertical-align:-3px"></div>';
    h += ' <span style="font-size:12px;color:var(--tx3)">Wacht op aanmelding... (verloopt over ' + Math.round((data.expires_in || 900) / 60) + ' min)</span>';
    h += '</div>';
    h += '<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="cancelOutlookAuth()"><span class="mi">close</span> Annuleren</button>';
    h += '</div>';
    flowEl.innerHTML = h;

    // Eén blokkerend verzoek — MSAL pollt intern tot de gebruiker inlogt
    waitForDeviceFlowCompletion();
  });
}

function waitForDeviceFlowCompletion() {
  // MSAL's acquire_token_by_device_flow is blocking (pollt intern).
  // We maken één langlopend request dat pas terugkomt als de gebruiker
  // inlogt of de flow verloopt.
  if (_outlookAbortCtrl) _outlookAbortCtrl.abort();
  _outlookAbortCtrl = new AbortController();

  fetch(API + '/outlook/auth/complete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    signal: _outlookAbortCtrl.signal,
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    _outlookAbortCtrl = null;
    var statusEl = document.getElementById('deviceFlowStatus');

    if (data.ok) {
      // Succes!
      var flowEl = document.getElementById('outlookDeviceFlow');
      if (flowEl) {
        flowEl.innerHTML = '<div class="card" style="padding:16px;border-color:var(--green);text-align:center">' +
          '<span class="mi" style="font-size:32px;color:var(--green)">check_circle</span>' +
          '<p style="font-size:14px;font-weight:600;color:var(--green);margin-top:8px">Outlook gekoppeld!</p></div>';
        setTimeout(function() { flowEl.style.display = 'none'; }, 3000);
      }
      toast('Outlook succesvol gekoppeld!');
      loadOutlookStatus();
    } else if (statusEl) {
      statusEl.innerHTML = '<p style="color:var(--red);font-size:12px"><span class="mi mi-sm">error</span> ' +
        esc(data.error || 'Login mislukt of verlopen') + '</p>';
    }
  })
  .catch(function(e) {
    _outlookAbortCtrl = null;
    if (e.name === 'AbortError') return; // Gebruiker heeft geannuleerd
    var statusEl = document.getElementById('deviceFlowStatus');
    if (statusEl) {
      statusEl.innerHTML = '<p style="color:var(--red);font-size:12px"><span class="mi mi-sm">error</span> Verbinding mislukt: ' + esc(e.message) + '</p>';
    }
  });
}

function cancelOutlookAuth() {
  if (_outlookAbortCtrl) { _outlookAbortCtrl.abort(); _outlookAbortCtrl = null; }
  var flowEl = document.getElementById('outlookDeviceFlow');
  if (flowEl) { flowEl.style.display = 'none'; flowEl.innerHTML = ''; }
}

function disconnectOutlook() {
  if (!confirm('Weet u zeker dat u Outlook wilt ontkoppelen?')) return;
  apiFetch('/outlook/disconnect', { method: 'POST' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout bij ontkoppelen'); return; }
    toast('Outlook ontkoppeld');
    loadOutlookStatus();
  });
}
</script>

</html>
