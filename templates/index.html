<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juridisch Assistent — Uw recht, uw handen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text y='28' font-size='28'>&#x2696;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a; --bg2: #111827; --bg3: #1e293b;
  --surface: rgba(30,41,59,.65); --glass: rgba(30,41,59,.45);
  --glass-bd: rgba(148,163,184,.15);
  --tx: #f1f5f9; --tx2: #94a3b8; --tx3: #64748b;
  --accent: #3b82f6; --accent2: #2563eb;
  --accent-soft: rgba(59,130,246,.12);
  --red: #ef4444; --red-soft: rgba(239,68,68,.12);
  --green: #22c55e; --green-soft: rgba(34,197,94,.12);
  --yellow: #eab308; --yellow-soft: rgba(234,179,8,.12);
  --purple: #a855f7; --purple-soft: rgba(168,85,247,.12);
  --r: 14px; --rs: 8px;
  --font: 'DM Sans', system-ui, sans-serif;
  --max-w: 1100px;
  --tr: .2s cubic-bezier(.4,0,.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--tx); line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 10px; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
.mi { font-family: 'Material Icons Round'; font-size: 20px; vertical-align: -4px; }
.mi-sm { font-size: 16px; vertical-align: -3px; }

/* LAYOUT */
.shell { display: flex; flex-direction: column; min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 100; background: rgba(10,14,26,.92); backdrop-filter: blur(16px); border-bottom: 1px solid var(--glass-bd); padding: 0 20px; }
.top-inner { max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; height: 54px; gap: 8px; }
.logo { font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.logo .mi { color: var(--accent); font-size: 24px; }
.logo b { color: var(--accent); }
.spacer { flex: 1; }
.nav-links { display: flex; gap: 4px; align-items: center; }
.nav-btn { padding: 6px 14px; border-radius: var(--rs); font: 500 13px var(--font); color: var(--tx2); cursor: pointer; border: none; background: none; transition: var(--tr); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.nav-btn:hover { color: var(--tx); background: var(--glass); }
.nav-btn.active { color: var(--tx); background: var(--surface); }
.nav-btn.cta { background: var(--accent); color: #fff; font-weight: 600; }
.nav-btn.cta:hover { background: var(--accent2); }
.hamburger { display: none; background: none; border: none; color: var(--tx); cursor: pointer; padding: 4px; }
@media(max-width:768px){
  .nav-links { display: none; position: absolute; top: 54px; left: 0; right: 0; background: rgba(10,14,26,.95); backdrop-filter: blur(16px); flex-direction: column; padding: 12px; border-bottom: 1px solid var(--glass-bd); gap: 4px; }
  .nav-links.open { display: flex; }
  .hamburger { display: block; }
}
.main { flex: 1; max-width: var(--max-w); margin: 0 auto; padding: 24px 20px; width: 100%; }
.footer { background: var(--bg2); border-top: 1px solid var(--glass-bd); padding: 16px; text-align: center; font-size: 11px; color: var(--tx3); }

/* COMPONENTS */
.card { background: var(--surface); border: 1px solid var(--glass-bd); border-radius: var(--r); padding: 20px; backdrop-filter: blur(8px); transition: var(--tr); }
.card:hover { border-color: rgba(148,163,184,.25); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: var(--rs); font: 600 13px var(--font); border: 1px solid transparent; cursor: pointer; transition: var(--tr); text-decoration: none; }
.btn-blue { background: var(--accent); color: #fff; } .btn-blue:hover { background: var(--accent2); text-decoration: none; }
.btn-red { background: var(--red); color: #fff; } .btn-red:hover { background: #dc2626; text-decoration: none; }
.btn-green { background: var(--green); color: #fff; } .btn-green:hover { background: #16a34a; text-decoration: none; }
.btn-ghost { background: var(--glass); color: var(--tx); border-color: var(--glass-bd); } .btn-ghost:hover { background: var(--surface); text-decoration: none; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn .mi { font-size: 16px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font: 600 11px var(--font); }
.badge-blue { background: var(--accent-soft); color: var(--accent); }
.badge-red { background: var(--red-soft); color: var(--red); }
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-yellow { background: var(--yellow-soft); color: var(--yellow); }
.badge-purple { background: var(--purple-soft); color: var(--purple); }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font: 500 13px var(--font); color: var(--tx2); margin-bottom: 6px; }
.form-input { width: 100%; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--rs); color: var(--tx); font: 14px var(--font); transition: var(--tr); }
.form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
textarea.form-input { min-height: 100px; resize: vertical; }
select.form-input { cursor: pointer; }

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.dot-green { background: var(--green); } .dot-red { background: var(--red); } .dot-yellow { background: var(--yellow); } .dot-gray { background: var(--tx3); }

.section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title .mi { font-size: 24px; color: var(--accent); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--tx3); }
.empty-state .mi { font-size: 48px; display: block; margin-bottom: 12px; opacity: .5; }

.toast-box { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column-reverse; gap: 8px; }
.toast { background: var(--surface); border: 1px solid var(--glass-bd); backdrop-filter: blur(12px); padding: 10px 18px; border-radius: var(--rs); font-size: 13px; color: var(--tx); box-shadow: 0 8px 32px rgba(0,0,0,.3); animation: tIn .3s ease; max-width: 380px; }
@keyframes tIn { from { opacity: 0; transform: translateY(10px); } }

/* TABS */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--glass-bd); margin-bottom: 20px; }
.tab { padding: 10px 18px; font: 500 13px var(--font); color: var(--tx3); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: var(--tr); display: flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--tx2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab .mi { font-size: 16px; }

/* DIFF VIEW */
.diff-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:768px){ .diff-container { grid-template-columns: 1fr; } }
.diff-panel { background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--rs); padding: 16px; max-height: 500px; overflow-y: auto; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
.diff-panel h4 { font-size: 12px; color: var(--tx3); margin-bottom: 8px; text-transform: uppercase; }
.highlight-pii { background: rgba(239,68,68,.2); padding: 1px 4px; border-radius: 3px; color: var(--red); }
.highlight-anon { background: rgba(59,130,246,.2); padding: 1px 4px; border-radius: 3px; color: var(--accent); }

/* MAPPING TABLE */
.map-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.map-table th { text-align: left; color: var(--tx3); font-weight: 600; font-size: 11px; text-transform: uppercase; padding: 8px; border-bottom: 1px solid var(--glass-bd); }
.map-table td { padding: 8px; border-bottom: 1px solid rgba(148,163,184,.08); }
.map-table input { background: var(--bg); border: 1px solid var(--glass-bd); border-radius: 4px; padding: 4px 8px; color: var(--tx); font: 12px var(--font); width: 100%; }

/* EMAIL BODY */
.email-body-html { word-break: break-word; }
.email-body-html img { max-width: 100%; height: auto; }
.email-body-html table { max-width: 100%; }
.email-body-html a { color: var(--accent); }

/* ANALYSIS RESULT */
.analysis-card { background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
.analysis-card h3 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.analysis-body { font-size: 14px; line-height: 1.8; color: var(--tx2); white-space: pre-wrap; }

/* SAMENVATTING CARD */
.samenvatting-card { background: var(--bg2); border: 1px solid var(--accent); border-radius: var(--r); padding: 20px; margin-bottom: 16px; }
.samenvatting-card h3 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.samenvatting-body { font-size: 14px; line-height: 1.8; color: var(--tx2); white-space: pre-wrap; }
.samenvatting-stale { border-color: #eab308; background: rgba(234,179,8,.05); }
.samenvatting-actions { display: flex; gap: 6px; margin-top: 12px; }
.samenvatting-meta { font-size: 11px; color: var(--tx3); margin-top: 8px; }

/* LOADING */
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--glass-bd); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { text-align: center; padding: 40px; color: var(--tx3); }

/* HERO */
.hero { text-align: center; padding: 48px 20px 32px; }
.hero-icon { font-size: 56px; margin-bottom: 12px; display: block; opacity: .9; }
.hero h1 { font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; }
.hero h1 span { color: var(--accent); }
.hero p { font-size: 15px; color: var(--tx2); max-width: 600px; margin: 0 auto 24px; line-height: 1.7; }
.hero-privacy { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); background: var(--green-soft); padding: 6px 14px; border-radius: 20px; margin-bottom: 24px; }

/* STEPS */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 24px 0 32px; }
.step { background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--r); padding: 20px; text-align: center; position: relative; }
.step-num { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; width: 24px; height: 24px; border-radius: 50%; font: 700 12px var(--font); display: flex; align-items: center; justify-content: center; }
.step .mi { font-size: 32px; color: var(--accent); display: block; margin-bottom: 8px; }
.step h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.step p { font-size: 12px; color: var(--tx3); line-height: 1.5; }

/* PROCEDURE CARDS */
.proc-card { background: var(--surface); border: 1px solid var(--glass-bd); border-radius: var(--r); overflow: hidden; transition: var(--tr); }
.proc-card:hover { border-color: rgba(148,163,184,.3); transform: translateY(-2px); }
.proc-header { padding: 16px 20px; border-bottom: 1px solid var(--glass-bd); display: flex; align-items: center; gap: 12px; }
.proc-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.proc-icon .mi { font-size: 22px; color: #fff; }
.proc-body { padding: 16px 20px; }
.proc-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.proc-meta-item { font-size: 12px; color: var(--tx2); display: flex; align-items: center; gap: 4px; }
.proc-meta-item .mi { font-size: 14px; color: var(--tx3); }
.proc-desc { font-size: 13px; color: var(--tx2); line-height: 1.6; margin-bottom: 12px; }
.proc-steps { list-style: none; }
.proc-steps li { font-size: 12px; color: var(--tx3); padding: 4px 0; display: flex; align-items: center; gap: 8px; }
.proc-steps li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.proc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

/* HEALTH EXPANDED */
.health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 24px; }
.health-item { background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--rs); padding: 12px; display: flex; align-items: center; gap: 10px; }
.health-item .mi { font-size: 20px; }
.health-label { font-size: 12px; font-weight: 600; }
.health-desc { font-size: 10px; color: var(--tx3); }

/* CATEGORY HEADER */
.cat-header { display: flex; align-items: center; gap: 10px; margin: 32px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--glass-bd); }
.cat-header .mi { font-size: 22px; color: var(--accent); }
.cat-header h2 { font-size: 17px; font-weight: 700; }
.cat-header span { font-size: 12px; color: var(--tx3); }

/* LEGAL REFERENCE PAGE */
.legal-intro { background: linear-gradient(135deg, rgba(59,130,246,.08), rgba(168,85,247,.06)); border: 1px solid var(--glass-bd); border-radius: var(--r); padding: 28px 24px; margin-bottom: 28px; }
.legal-intro h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.legal-intro p { font-size: 14px; color: var(--tx2); line-height: 1.7; max-width: 800px; }

.legal-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; padding: 16px 20px; background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--rs); }
.legal-flow-item { padding: 6px 14px; border-radius: 20px; font: 600 12px var(--font); white-space: nowrap; cursor: pointer; transition: var(--tr); }
.legal-flow-item:hover { filter: brightness(1.2); }
.legal-flow-arrow { color: var(--tx3); font-size: 16px; user-select: none; }

.legal-cat-section { margin-bottom: 40px; }
.legal-cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 14px 20px; background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--r); }
.legal-cat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.legal-cat-icon .mi { font-size: 22px; color: #fff; }
.legal-cat-header h2 { font-size: 18px; font-weight: 700; flex: 1; }
.legal-cat-header .badge { font-size: 11px; }

.legal-card { background: var(--surface); border: 1px solid var(--glass-bd); border-radius: var(--r); margin-bottom: 16px; overflow: hidden; transition: var(--tr); }
.legal-card.expanded .legal-card-body { display: block; }
.legal-card-top { padding: 18px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: var(--tr); }
.legal-card-top:hover { background: rgba(59,130,246,.04); }
.legal-card-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.legal-card-icon .mi { font-size: 24px; color: #fff; }
.legal-card-info { flex: 1; min-width: 0; }
.legal-card-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.legal-card-info .legal-sub { font-size: 12px; color: var(--tx3); display: flex; flex-wrap: wrap; gap: 12px; }
.legal-card-info .legal-sub span { display: inline-flex; align-items: center; gap: 3px; }
.legal-card-info .legal-sub .mi { font-size: 13px; }
.legal-card-chevron { color: var(--tx3); transition: transform .2s ease; font-size: 24px; }
.legal-card.expanded .legal-card-chevron { transform: rotate(180deg); }
.legal-card-body { display: none; border-top: 1px solid var(--glass-bd); }

.legal-section { padding: 16px 20px; border-bottom: 1px solid rgba(148,163,184,.06); }
.legal-section:last-child { border-bottom: none; }
.legal-section h4 { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .5px; }
.legal-section h4 .mi { font-size: 16px; }
.legal-section p, .legal-section .legal-text { font-size: 13px; color: var(--tx2); line-height: 1.8; white-space: pre-line; }
.legal-section ul { list-style: none; margin: 0; padding: 0; }
.legal-section ul li { font-size: 13px; color: var(--tx2); padding: 4px 0 4px 20px; position: relative; line-height: 1.6; }
.legal-section ul li::before { content: ''; position: absolute; left: 6px; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

.legal-articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; }
.legal-article { display: flex; gap: 10px; padding: 8px 12px; background: var(--bg2); border-radius: var(--rs); font-size: 12px; }
.legal-article-ref { font-weight: 700; color: var(--accent); white-space: nowrap; min-width: 100px; }
.legal-article-desc { color: var(--tx2); }

.legal-tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
.legal-tip { display: flex; gap: 8px; padding: 8px 12px; background: rgba(234,179,8,.06); border: 1px solid rgba(234,179,8,.12); border-radius: var(--rs); font-size: 12px; color: var(--tx2); align-items: start; }
.legal-tip .mi { font-size: 14px; color: var(--yellow); flex-shrink: 0; margin-top: 1px; }

.legal-steps-flow { display: flex; flex-direction: column; gap: 0; }
.legal-step { display: flex; align-items: start; gap: 12px; padding: 8px 0; position: relative; }
.legal-step-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 11px var(--font); color: #fff; flex-shrink: 0; position: relative; z-index: 1; }
.legal-step:not(:last-child)::before { content: ''; position: absolute; left: 13px; top: 34px; bottom: -8px; width: 1px; background: var(--glass-bd); }
.legal-step-text { font-size: 13px; color: var(--tx2); padding-top: 3px; }

.legal-badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.legal-badge-item { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }

.legal-filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.legal-filter-btn { padding: 7px 16px; border-radius: 20px; font: 500 13px var(--font); border: 1px solid var(--glass-bd); background: var(--bg2); color: var(--tx2); cursor: pointer; transition: var(--tr); display: flex; align-items: center; gap: 5px; }
.legal-filter-btn:hover { border-color: var(--accent); color: var(--tx); }
.legal-filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* FOLDER BROWSER */
.fb-modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.fb-box { background: var(--bg); border: 1px solid var(--glass-bd); border-radius: var(--r); width: 90%; max-width: 700px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 24px 48px rgba(0,0,0,.4); }
.fb-header { padding: 14px 20px; border-bottom: 1px solid var(--glass-bd); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.fb-header h3 { font-size: 15px; font-weight: 700; flex: 1; }
.fb-path { padding: 8px 20px; background: var(--bg2); border-bottom: 1px solid var(--glass-bd); font-size: 12px; color: var(--tx2); display: flex; align-items: center; gap: 6px; flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
.fb-path-seg { cursor: pointer; color: var(--accent); padding: 2px 4px; border-radius: 3px; }
.fb-path-seg:hover { background: var(--accent-soft); }
.fb-body { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 200px; }
.fb-item { display: flex; align-items: center; gap: 10px; padding: 8px 20px; cursor: pointer; transition: var(--tr); font-size: 13px; }
.fb-item:hover { background: var(--glass); }
.fb-item.selected { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.fb-item .mi { font-size: 20px; flex-shrink: 0; }
.fb-item-info { flex: 1; min-width: 0; }
.fb-item-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-item-meta { font-size: 11px; color: var(--tx3); }
.fb-item.folder .mi { color: var(--yellow); }
.fb-item.drive .mi { color: var(--accent); }
.fb-item.shortcut .mi { color: var(--green); }
.fb-item.file .mi { color: var(--tx3); }
.fb-item.file.supported .mi { color: var(--green); }
.fb-footer { padding: 12px 20px; border-top: 1px solid var(--glass-bd); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.fb-selected-path { flex: 1; font-size: 12px; color: var(--tx2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* TIMELINE */
.tl-container { position: relative; padding-left: 28px; }
.tl-line { position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--glass-bd); }
.tl-item { position: relative; margin-bottom: 12px; }
.tl-dot { position: absolute; left: -23px; top: 14px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); z-index: 1; }
.tl-dot.doc { background: var(--accent); }
.tl-dot.email { background: var(--purple); }
.tl-card { background: var(--surface); border: 1px solid var(--glass-bd); border-radius: var(--rs); padding: 12px 16px; transition: var(--tr); cursor: pointer; }
.tl-card:hover { border-color: rgba(148,163,184,.3); }
.tl-card.email-card { border-left: 3px solid var(--purple); }
.tl-card.doc-card { border-left: 3px solid var(--accent); }
.tl-date-header { font-size: 12px; font-weight: 700; color: var(--tx2); margin: 20px 0 8px -28px; padding: 4px 12px; background: var(--bg2); border-radius: var(--rs); display: inline-block; }
.tl-date-header:first-child { margin-top: 0; }
.tl-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.tl-sub { font-size: 12px; color: var(--tx3); line-height: 1.5; }
.tl-meta { font-size: 11px; color: var(--tx3); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.tl-meta span { display: inline-flex; align-items: center; gap: 3px; }
.tl-meta .mi { font-size: 13px; }
.tl-filter { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.tl-filter-btn { padding: 5px 14px; border-radius: 16px; font: 500 12px var(--font); border: 1px solid var(--glass-bd); background: var(--bg2); color: var(--tx2); cursor: pointer; transition: var(--tr); display: flex; align-items: center; gap: 4px; }
.tl-filter-btn:hover { border-color: var(--accent); color: var(--tx); }
.tl-filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* EMAIL DETAIL MODAL */
.email-modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; animation: fadeIn .2s ease; }
.email-modal-box { background: var(--bg); border: 1px solid var(--glass-bd); border-radius: var(--r); width: 90%; max-width: 700px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 24px 48px rgba(0,0,0,.4); }
.email-modal-header { padding: 14px 20px; border-bottom: 1px solid var(--glass-bd); display: flex; align-items: center; gap: 8px; }
.email-modal-header h3 { font-size: 15px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.email-modal-meta { padding: 10px 20px; border-bottom: 1px solid var(--glass-bd); font-size: 12px; color: var(--tx2); background: var(--bg2); line-height: 1.8; }
.email-modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; font-size: 13px; color: var(--tx); line-height: 1.7; }
.email-modal-body iframe { width: 100%; border: none; min-height: 300px; background: #fff; border-radius: var(--rs); }

/* SCAN PREVIEW */
.scan-preview { background: var(--bg2); border: 1px solid var(--glass-bd); border-radius: var(--r); margin-top: 12px; overflow: hidden; }
.scan-header { padding: 12px 16px; border-bottom: 1px solid var(--glass-bd); display: flex; align-items: center; gap: 8px; }
.scan-header .mi { color: var(--green); }
.scan-stats { display: flex; gap: 16px; padding: 10px 16px; font-size: 12px; color: var(--tx2); border-bottom: 1px solid rgba(148,163,184,.06); }
.scan-stat { display: flex; align-items: center; gap: 4px; }
.scan-stat .mi { font-size: 14px; color: var(--tx3); }
.scan-subfolder { border-bottom: 1px solid rgba(148,163,184,.06); }
.scan-subfolder:last-child { border-bottom: none; }
.scan-subfolder-head { padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--tx); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.scan-subfolder-head:hover { background: var(--glass); }
.scan-subfolder-head .mi { font-size: 16px; color: var(--yellow); }
.scan-subfolder-head .count { color: var(--tx3); font-weight: 400; }
.scan-file { padding: 4px 16px 4px 36px; font-size: 11px; color: var(--tx3); display: flex; align-items: center; gap: 6px; }
.scan-file .mi { font-size: 14px; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-inner">
      <div class="logo" onclick="go('/')"><span class="mi">balance</span> Juridisch <b>Assistent</b></div>
      <div class="spacer"></div>
      <button class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')"><span class="mi">menu</span></button>
      <nav class="nav-links" id="navLinks">
        <button class="nav-btn" data-r="/" onclick="go('/')"><span class="mi mi-sm">dashboard</span> Dashboard</button>
        <button class="nav-btn" data-r="/procedures" onclick="go('/procedures')"><span class="mi mi-sm">gavel</span> Procedures</button>
        <button class="nav-btn" data-r="/emails" onclick="go('/emails')"><span class="mi mi-sm">email</span> E-mails</button>
        <a class="nav-btn" href="/scanner" style="text-decoration:none"><span class="mi mi-sm">document_scanner</span> Scanner</a>
        <button class="nav-btn" data-r="/instellingen" onclick="go('/instellingen')"><span class="mi mi-sm">settings</span> Instellingen</button>
        <button class="nav-btn cta" onclick="go('/nieuw')"><span class="mi mi-sm">add_circle</span> Nieuwe zaak</button>
      </nav>
    </div>
  </header>

  <main class="main" id="app">
    <div class="loading"><div class="spinner"></div></div>
  </main>

  <footer class="footer">Juridisch Assistent — Alle data blijft lokaal op uw computer. <span style="color:var(--accent)">&#x2696;</span></footer>
</div>
<div class="toast-box" id="toasts"></div>

<script>
// ============================================================
// GLOBALS & HELPERS
// ============================================================
var API = '/api';
var _route = '/', _routeId = '';
var _health = null;

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function toast(msg) {
  var box = document.getElementById('toasts');
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  box.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4000);
}
function fmtBytes(b) { if (!b) return '0 B'; var u = ['B','KB','MB','GB']; var i = Math.floor(Math.log(b)/Math.log(1024)); return (b/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]; }
function fmtDate(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateTime(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

function apiFetch(url, opts, cb) {
  if (typeof opts === 'function') { cb = opts; opts = {}; }
  opts = opts || {};
  var o = { method: opts.method || 'GET', headers: {} };
  if (opts.body) { o.body = JSON.stringify(opts.body); o.headers['Content-Type'] = 'application/json'; }
  fetch(API + url, o)
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, status:r.status, data:d}; }); })
    .then(function(res){ cb(null, res.data, res.ok); })
    .catch(function(e){ cb(e.message || 'Netwerkfout'); });
}

// ============================================================
// ROUTER (zelfde patroon als meldpunt)
// ============================================================
function go(path) { window.location.hash = '#' + path; }

function parseRoute() {
  var h = (window.location.hash || '#/').slice(1);
  var parts = h.split('/').filter(Boolean);
  _route = '/' + (parts[0] || '');
  _routeId = parts[1] || '';
  // Sub-routes
  if (parts[2]) _route += '/' + parts[0]; // for tab tracking
}

window.addEventListener('hashchange', function(){ parseRoute(); render(); });
window.addEventListener('load', function(){ parseRoute(); render(); });

function render() {
  parseRoute();
  var app = document.getElementById('app');

  // Update nav active state
  document.querySelectorAll('.nav-btn[data-r]').forEach(function(b){
    b.classList.toggle('active', b.dataset.r === _route || (_route.startsWith(b.dataset.r) && b.dataset.r !== '/'));
  });

  switch(_route) {
    case '/':         app.innerHTML = pgDashboard(); break;
    case '/nieuw':    app.innerHTML = pgNieuweZaak(); break;
    case '/zaak':     pgZaak(_routeId); break;
    case '/document': pgDocument(_routeId); break;
    case '/anonimiseer': pgAnonReview(_routeId); break;
    case '/analyse':  pgAnalyse(_routeId); break;
    case '/procedures': app.innerHTML = pgProcedures(); break;
    case '/emails': pgEmails(); break;
    case '/email': pgEmailDetail(_routeId); break;
    case '/instellingen': pgInstellingen(); break;
    default: app.innerHTML = pgDashboard();
  }
}

// ============================================================
// PAGES
// ============================================================

// ---- DASHBOARD ----
function pgDashboard() {
  var h = '<div id="dashContent"><div class="loading"><div class="spinner"></div></div></div>';
  setTimeout(loadDashboard, 10);
  return h;
}

function loadDashboard() {
  // Eerst settings ophalen om te kijken of hoofdmap is ingesteld
  apiFetch('/settings', function(err, settings) {
    var el = document.getElementById('dashContent');
    if (!el) return;

    var hoofdmap = (settings && settings.hoofdmap) ? settings.hoofdmap : '';

    if (!hoofdmap) {
      // ===== GEEN HOOFDMAP — WELKOM SCHERM =====
      renderWelcome(el);
    } else {
      // ===== HOOFDMAP INGESTELD — ZAKEN TONEN =====
      renderHoofdmap(el, hoofdmap);
    }
  });
}

function renderWelcome(el) {
  var h = '';

  h += '<div class="hero">';
  h += '<div class="hero-icon">&#x2696;&#xFE0F;</div>';
  h += '<h1>Uw recht, <span>uw handen</span></h1>';
  h += '<p>Welkom bij de Juridisch Assistent. Selecteer de map op uw computer waar al uw rechtszaken staan. Elke submap wordt automatisch als aparte zaak herkend met alle documenten erin.</p>';
  h += '<div class="hero-privacy"><span class="mi mi-sm">lock</span> Alle documenten blijven op uw eigen computer.</div>';
  h += '</div>';

  // Stappen
  h += '<div class="steps">';
  h += '<div class="step"><div class="step-num">1</div><span class="mi">folder_open</span><h3>Map kiezen</h3><p>Kies de map waar al uw rechtszaken als submappen staan.</p></div>';
  h += '<div class="step"><div class="step-num">2</div><span class="mi">search</span><h3>Automatisch scannen</h3><p>Elke submap wordt een zaak. Alle PDF\'s, scans en brieven worden gevonden.</p></div>';
  h += '<div class="step"><div class="step-num">3</div><span class="mi">psychology</span><h3>AI analyseert</h3><p>De AI leest uw documenten en adviseert de juiste juridische procedure.</p></div>';
  h += '<div class="step"><div class="step-num">4</div><span class="mi">edit_document</span><h3>Actie ondernemen</h3><p>Bezwaar, klacht of beroep — automatisch opgesteld, klaar om in te dienen.</p></div>';
  h += '</div>';

  // CTA: folder kiezen
  h += '<div style="text-align:center;margin:16px 0 32px">';
  h += '<button class="btn btn-blue" style="padding:14px 36px;font-size:16px" onclick="openFolderBrowser(null, onHoofdmapSelected)"><span class="mi">folder_open</span> Kies uw map met rechtszaken</button>';
  h += '</div>';

  // Voorbeeld structuur
  h += '<div class="card" style="max-width:500px;margin:0 auto">';
  h += '<h3 style="font-size:13px;color:var(--tx3);margin-bottom:10px"><span class="mi mi-sm">info</span> Uw mapstructuur moet er zo uitzien:</h3>';
  h += '<div style="font-family:monospace;font-size:12px;color:var(--tx2);line-height:2;padding-left:4px">';
  h += '<span style="color:var(--yellow)">&#128193;</span> Mijn Rechtszaken<br>';
  h += '&nbsp;&nbsp;&nbsp;<span style="color:var(--yellow)">&#128193;</span> Bezwaar WOZ 2024<br>';
  h += '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#128196; beschikking.pdf<br>';
  h += '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#128196; bezwaarschrift.docx<br>';
  h += '&nbsp;&nbsp;&nbsp;<span style="color:var(--yellow)">&#128193;</span> Klacht Belastingdienst<br>';
  h += '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#128196; klacht.pdf<br>';
  h += '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#128196; reactie.pdf<br>';
  h += '&nbsp;&nbsp;&nbsp;<span style="color:var(--yellow)">&#128193;</span> WOO verzoek Gemeente<br>';
  h += '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&#128196; verzoek.pdf<br>';
  h += '</div>';
  h += '</div>';

  el.innerHTML = h;
}

function onHoofdmapSelected() {
  // Wordt aangeroepen na het selecteren van een map in de folder browser
  var folder = _selectedFolder;
  if (!folder) return;

  // Sla op als hoofdmap
  apiFetch('/settings', { method: 'PUT', body: { hoofdmap: folder } }, function() {
    // Scan en toon preview
    var el = document.getElementById('dashContent');
    if (el) renderHoofdmap(el, folder);
  });
}

function renderHoofdmap(el, hoofdmap) {
  var h = '';

  // Header met pad en wijzig-knop
  h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">';
  h += '<span class="mi" style="font-size:28px;color:var(--yellow)">folder_open</span>';
  h += '<div style="flex:1;min-width:200px">';
  h += '<h1 style="font-size:22px;font-weight:800">Mijn rechtszaken</h1>';
  h += '<div style="font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:4px"><span class="mi mi-sm">folder</span> ' + esc(hoofdmap) + '</div>';
  h += '</div>';
  h += '<button class="btn btn-ghost btn-sm" onclick="openFolderBrowser(null, onHoofdmapSelected)"><span class="mi">edit</span> Andere map</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="refreshHoofdmap(\'' + esc(hoofdmap.replace(/\\/g, '\\\\').replace(/'/g, "\\'")) + '\')"><span class="mi">refresh</span> Vernieuwen</button>';
  h += '<button class="btn btn-blue btn-sm" onclick="go(\'/nieuw\')"><span class="mi">add_circle</span> Losse zaak</button>';
  h += '</div>';

  // Health bar compact
  h += '<div id="healthBar" style="margin-bottom:16px"></div>';

  // Deadlines overzicht + zaak status
  h += '<div id="deadlinesOverview" style="margin-bottom:16px"></div>';

  // Scan resultaten
  h += '<div id="rootScanResults"><div class="loading"><div class="spinner"></div></div></div>';

  // Bestaande zaken die al geimporteerd zijn
  h += '<div id="zakenSection"></div>';

  el.innerHTML = h;

  // Health laden
  loadHealthBar();

  // Scan de hoofdmap
  scanRootFolder(hoofdmap);

  // Bestaande zaken laden
  loadExistingZaken();

  // Deadlines en status overzicht
  loadDeadlinesOverview();
}

function loadDeadlinesOverview() {
  var el = document.getElementById('deadlinesOverview');
  if (!el) return;

  apiFetch('/zaken', function(err, zaken) {
    if (err || !zaken || !zaken.length) { el.innerHTML = ''; return; }

    var now = new Date();
    var actief = zaken.filter(function(z) { return z.status === 'actief' || z.deadline; });
    var metDeadline = zaken.filter(function(z) { return z.deadline; }).sort(function(a, b) {
      return new Date(a.deadline) - new Date(b.deadline);
    });

    // Totaal statistieken
    var totaalZaken = zaken.length;
    var totaalActief = actief.length;
    var metSamenvatting = zaken.filter(function(z) { return z.omschrijving && z.omschrijving.length > 20; }).length;
    var totaalDocs = zaken.reduce(function(sum, z) { return sum + (z.doc_count || 0); }, 0);
    var docsGeextraheerd = zaken.reduce(function(sum, z) { return sum + (z.docs_extracted || 0); }, 0);

    var h = '';

    // Urgente deadlines bovenaan
    if (metDeadline.length) {
      h += '<div style="background:var(--bg2);border-radius:12px;padding:16px;margin-bottom:12px">';
      h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
      h += '<h3 style="font-size:15px;margin:0"><span class="mi" style="color:#f97316;vertical-align:-3px">notifications_active</span> Komende deadlines</h3>';
      h += '<span style="font-size:11px;color:var(--tx3)">' + metDeadline.length + ' actieve termijnen</span>';
      h += '</div>';

      metDeadline.forEach(function(z) {
        var dl = new Date(z.deadline);
        var days = Math.ceil((dl - now) / 86400000);
        var dcolor = days <= 3 ? '#ef4444' : days <= 7 ? '#f97316' : days <= 14 ? '#eab308' : '#10b981';
        var urgentie = days <= 0 ? 'VERLOPEN' : days <= 3 ? 'URGENT' : days <= 7 ? 'Binnenkort' : days + ' dagen';

        h += '<div style="display:flex;align-items:start;gap:10px;padding:10px 12px;margin-bottom:6px;background:var(--bg);border-radius:8px;border-left:3px solid ' + dcolor + ';cursor:pointer" onclick="go(\'/zaak/' + z.id + '\')">';

        // Datum
        h += '<div style="min-width:60px;text-align:center">';
        h += '<div style="font-size:20px;font-weight:800;color:' + dcolor + '">' + dl.getDate() + '</div>';
        h += '<div style="font-size:10px;color:var(--tx3);text-transform:uppercase">' + ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][dl.getMonth()] + '</div>';
        h += '</div>';

        // Info
        h += '<div style="flex:1;min-width:0">';
        h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">';
        h += '<strong style="font-size:13px">' + esc(z.naam) + '</strong>';
        h += '<span style="font-size:10px;font-weight:700;color:#fff;background:' + dcolor + ';padding:1px 6px;border-radius:4px">' + urgentie + '</span>';
        h += '</div>';
        if (z.deadline_reden) {
          h += '<div style="font-size:11px;color:var(--tx2);line-height:1.4">' + esc(z.deadline_reden) + '</div>';
        }
        h += '</div>';

        // Actie
        h += '<span class="mi" style="color:' + dcolor + ';font-size:18px;margin-top:4px">arrow_forward</span>';
        h += '</div>';
      });
      h += '</div>';
    }

    // Zaak status overzicht
    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">';

    // Actieve zaken
    h += '<div style="flex:1;min-width:120px;padding:10px 14px;background:var(--bg2);border-radius:10px;text-align:center">';
    h += '<div style="font-size:24px;font-weight:800;color:var(--green)">' + totaalActief + '</div>';
    h += '<div style="font-size:10px;color:var(--tx3)">Actieve zaken</div></div>';

    // Met AI analyse
    h += '<div style="flex:1;min-width:120px;padding:10px 14px;background:var(--bg2);border-radius:10px;text-align:center">';
    h += '<div style="font-size:24px;font-weight:800;color:var(--accent)">' + metSamenvatting + '</div>';
    h += '<div style="font-size:10px;color:var(--tx3)">Met samenvatting</div></div>';

    // Documenten
    h += '<div style="flex:1;min-width:120px;padding:10px 14px;background:var(--bg2);border-radius:10px;text-align:center">';
    h += '<div style="font-size:24px;font-weight:800;color:var(--purple)">' + totaalDocs + '</div>';
    h += '<div style="font-size:10px;color:var(--tx3)">Documenten totaal</div></div>';

    // Niet geanalyseerd
    var nietGeanalyseerd = totaalZaken - metSamenvatting;
    if (nietGeanalyseerd > 0) {
      h += '<div style="flex:1;min-width:120px;padding:10px 14px;background:rgba(239,68,68,.08);border-radius:10px;text-align:center;border:1px solid rgba(239,68,68,.2)">';
      h += '<div style="font-size:24px;font-weight:800;color:#ef4444">' + nietGeanalyseerd + '</div>';
      h += '<div style="font-size:10px;color:#ef4444">Nog niet geanalyseerd</div></div>';
    }

    h += '</div>';

    el.innerHTML = h;
  });
}

function refreshHoofdmap(pad) {
  var el = document.getElementById('dashContent');
  if (el) renderHoofdmap(el, pad);
}

function loadHealthBar() {
  apiFetch('/health', function(err, data) {
    if (err) return;
    _health = data;
    var hb = document.getElementById('healthBar');
    if (!hb) return;
    var h = '<div class="health-grid">';
    h += healthItem('smart_toy', 'Ollama', data.ollama.available ? 'Verbonden' : 'Niet actief', data.ollama.available ? 'var(--green)' : 'var(--tx3)');
    h += healthItem('cloud', 'Cloud AI', data.cloud_ai.has_key ? data.cloud_ai.provider : 'Geen key', data.cloud_ai.has_key ? 'var(--green)' : 'var(--yellow)');
    h += healthItem('description', 'PDF', data.document_processing.pdf ? 'OK' : 'Niet beschikbaar', data.document_processing.pdf ? 'var(--green)' : 'var(--red)');
    h += healthItem('camera', 'OCR', data.document_processing.ocr ? 'OK' : 'Niet beschikbaar', data.document_processing.ocr ? 'var(--green)' : 'var(--yellow)');
    h += healthItem('flag', 'Meldpunt', data.meldpunt.available ? 'Online' : 'Offline', data.meldpunt.available ? 'var(--green)' : 'var(--tx3)');
    h += '</div>';
    hb.innerHTML = h;
  });
}

function scanRootFolder(pad) {
  var el = document.getElementById('rootScanResults');
  if (!el) return;

  apiFetch('/browse/scan-root', { method: 'POST', body: { path: pad } }, function(err, data) {
    if (!el) return;
    if (err) { el.innerHTML = '<div class="card" style="color:var(--red);padding:16px"><span class="mi">error</span> ' + esc(err) + '</div>'; return; }

    if (!data.zaken || data.zaken.length === 0) {
      el.innerHTML = '<div class="card" style="text-align:center;padding:32px;color:var(--tx3)">' +
        '<span class="mi" style="font-size:40px;display:block;margin-bottom:8px;opacity:.4">folder_off</span>' +
        '<p>Geen submappen met documenten gevonden.</p>' +
        '<p style="font-size:12px;margin-top:4px">Maak submappen aan voor elke rechtszaak en plaats daar uw brieven en documenten.</p></div>';
      return;
    }

    // Haal bestaande zaken op om te tonen welke al geïmporteerd zijn
    var allPaths = data.zaken.map(function(z){ return z.path; });
    apiFetch('/zaken/by-folders', { method: 'POST', body: { paths: allPaths } }, function(err2, existing) {
      var zakenMap = existing || {};
      renderSubfolderCards(el, data, zakenMap, pad);
    });
  });
}

function renderSubfolderCards(el, data, zakenMap, pad) {
  var h = '';

  // Overzicht balk
  var importedCount = 0;
  data.zaken.forEach(function(z){ if (zakenMap[z.path]) importedCount++; });

  h += '<div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">';
  h += '<div class="card" style="flex:1;min-width:140px;padding:14px;text-align:center">';
  h += '<div style="font-size:28px;font-weight:800;color:var(--accent)">' + data.zaken_count + '</div>';
  h += '<div style="font-size:12px;color:var(--tx3)">Zaken (submappen)</div></div>';
  h += '<div class="card" style="flex:1;min-width:140px;padding:14px;text-align:center">';
  h += '<div style="font-size:28px;font-weight:800;color:var(--green)">' + data.total_files + '</div>';
  h += '<div style="font-size:12px;color:var(--tx3)">Documenten totaal</div></div>';
  h += '<div class="card" style="flex:1;min-width:140px;padding:14px;text-align:center">';
  h += '<div style="font-size:28px;font-weight:800;color:var(--purple)">' + fmtBytes(data.total_size) + '</div>';
  h += '<div style="font-size:12px;color:var(--tx3)">Totale grootte</div></div>';
  h += '</div>';

  // Import alles knop (alleen als er nog niet-geïmporteerde zijn)
  if (importedCount < data.zaken_count) {
    h += '<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">';
    h += '<button class="btn btn-blue btn-sm" onclick="importAllZaken(\'' + esc(pad.replace(/\\/g, '\\\\').replace(/'/g, "\\'")) + '\')"><span class="mi">download</span> Alle zaken importeren</button>';
    h += '<span style="font-size:12px;color:var(--tx3)">' + (data.zaken_count - importedCount) + ' map' + ((data.zaken_count - importedCount) !== 1 ? 'pen' : '') + ' nog niet geïmporteerd</span>';
    h += '</div>';
  }

  // Per submap een klikbare kaart
  h += '<div class="card-grid">';
  data.zaken.forEach(function(z) {
    var escapedPath = z.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    var imported = zakenMap[z.path];

    h += '<div class="card" style="cursor:pointer;position:relative;transition:border-color .2s'
       + (imported ? ';border-color:var(--green)' : '') + '" '
       + 'onclick="openZaakFolder(\'' + esc(escapedPath) + '\',\'' + esc(z.naam.replace(/'/g, "\\'")) + '\')" '
       + 'onmouseenter="this.style.borderColor=\'var(--accent)\'" '
       + 'onmouseleave="this.style.borderColor=\'' + (imported ? 'var(--green)' : 'var(--glass-bd)') + '\'">';

    // Status en deadline voor geimporteerde zaken
    if (imported) {
      var statusColor = {'actief':'var(--green)','nieuw':'var(--accent)','wacht':'var(--yellow)','afgerond':'var(--tx3)','analyse':'var(--purple)'}[imported.status] || 'var(--tx3)';
      h += '<div style="position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:6px;font-size:10px">';
      h += '<span style="color:' + statusColor + ';font-weight:600;text-transform:uppercase;background:' + statusColor + '15;padding:2px 6px;border-radius:4px">' + esc(imported.status || 'nieuw') + '</span>';
      if (imported.doc_count) h += '<span style="color:var(--tx3)">' + imported.doc_count + ' docs</span>';
      h += '</div>';

      // Deadline/volgende actie als die er is
      if (imported.deadline) {
        var dl = new Date(imported.deadline), now = new Date(), days = Math.ceil((dl - now) / 86400000);
        var dcolor = days <= 3 ? 'var(--red)' : days <= 7 ? '#f97316' : days <= 14 ? 'var(--yellow)' : 'var(--green)';
        h += '<div style="margin-top:8px;font-size:11px;padding:8px 10px;background:' + dcolor + '10;border-radius:8px;border-left:3px solid ' + dcolor + '">';
        h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
        h += '<span class="mi" style="font-size:16px;color:' + dcolor + '">schedule</span>';
        h += '<span style="color:' + dcolor + ';font-weight:700;font-size:12px">' + (days <= 0 ? 'VERLOPEN!' : days + ' dagen resterend') + '</span>';
        h += '<span style="color:var(--tx3);font-size:10px">(' + imported.deadline + ')</span>';
        h += '</div>';
        if (imported.deadline_reden) {
          h += '<div style="color:var(--tx);font-size:11px;line-height:1.5;margin-bottom:6px">' + esc(imported.deadline_reden) + '</div>';
        }
        h += '<a href="#/zaak/' + imported.id + '" style="font-size:11px;color:' + dcolor + ';font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:3px">';
        h += '<span class="mi" style="font-size:14px">arrow_forward</span> Open zaak en onderneem actie</a>';
        h += '</div>';
      }
    }

    h += '<div style="display:flex;align-items:start;gap:10px">';
    h += '<span class="mi" style="font-size:28px;color:' + (imported ? 'var(--green)' : 'var(--yellow)') + '">' + (imported ? 'folder_special' : 'folder') + '</span>';
    h += '<div style="flex:1;min-width:0">';
    h += '<h3 style="font-size:15px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(z.naam) + '</h3>';

    // Toon samenvatting/omschrijving als die er is
    if (imported && imported.omschrijving) {
      h += '<div style="font-size:11px;color:var(--tx2);margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">' + esc(imported.omschrijving.substring(0, 120)) + (imported.omschrijving.length > 120 ? '...' : '') + '</div>';
    }

    h += '<div style="font-size:12px;color:var(--tx3);display:flex;gap:10px;flex-wrap:wrap">';
    h += '<span><span class="mi mi-sm">description</span> ' + z.file_count + ' documenten</span>';
    h += '<span><span class="mi mi-sm">data_usage</span> ' + fmtBytes(z.total_size) + '</span>';
    h += '</div>';

    // Bestanden tonen
    if (z.files && z.files.length) {
      h += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--glass-bd)">';
      var maxShow = Math.min(z.files.length, 4);
      for (var i = 0; i < maxShow; i++) {
        var f = z.files[i];
        var ext = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
        var ic = (ext === '.pdf') ? 'picture_as_pdf' : (ext === '.docx' || ext === '.doc') ? 'article' : (ext === '.png' || ext === '.jpg' || ext === '.jpeg') ? 'image' : 'description';
        h += '<div style="font-size:11px;color:var(--tx2);padding:2px 0;display:flex;align-items:center;gap:4px;overflow:hidden"><span class="mi" style="font-size:14px;color:var(--tx3)">' + ic + '</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(f.name) + '</span></div>';
      }
      if (z.files.length > 4) {
        h += '<div style="font-size:11px;color:var(--tx3);padding:2px 0">+ ' + (z.files.length - 4) + ' meer...</div>';
      }
      h += '</div>';
    }

    h += '</div></div>'; // flex
    h += '</div>'; // card
  });
  h += '</div>';

  el.innerHTML = h;
}

function openZaakFolder(pad, naam) {
  // Klik op submap-kaart: importeer als zaak (of open bestaande) en navigeer
  toast('Zaak openen...');
  apiFetch('/import-single', { method: 'POST', body: { path: pad, naam: naam } }, function(err, data) {
    if (err) { toast('Fout: ' + err); return; }
    if (data.ok && data.zaak_id) {
      if (data.created) {
        toast('Zaak aangemaakt met ' + (data.docs || 0) + ' documenten');
      } else if (data.synced > 0) {
        toast(data.synced + ' nieuwe documenten gevonden');
      }
      go('/zaak/' + data.zaak_id);
    } else {
      toast('Kon zaak niet openen');
    }
  });
}

function importAllZaken(pad) {
  if (!confirm('Wilt u alle submappen importeren als zaken?\n\nElke submap wordt een aparte zaak met alle documenten erin.\nBestaande zaken worden overgeslagen.')) return;

  var btn = event.target.closest('.btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span> Importeren...'; }

  apiFetch('/import-root', { method: 'POST', body: { path: pad } }, function(err, data) {
    if (err) { toast('Fout: ' + err); if (btn) btn.disabled = false; return; }

    if (data.ok) {
      toast(data.created + ' zaken aangemaakt, ' + data.total_docs + ' documenten geimporteerd!');
      // Herlaad dashboard
      var el = document.getElementById('dashContent');
      if (el) renderHoofdmap(el, pad);
    } else {
      toast('Import mislukt');
      if (btn) btn.disabled = false;
    }
  });
}

function loadExistingZaken() {
  // Nu geïntegreerd in scanRootFolder — toon losse zaken zonder hoofdmap-folder
  apiFetch('/zaken', function(err, data) {
    var el = document.getElementById('zakenSection');
    if (!el) return;
    if (err || !data || !data.length) return;

    // Filter: alleen zaken tonen die GEEN folder_path hebben (losse zaken)
    var losse = data.filter(function(z) { return !z.folder_path; });
    if (!losse.length) return;

    var h = '<div style="margin-top:24px">';
    h += '<div class="cat-header"><span class="mi">gavel</span><h2>Losse zaken</h2><span>' + losse.length + '</span></div>';
    h += '<div class="card-grid">';
    h += losse.map(function(z) {
      var badge = z.procedure_type ? '<span class="badge badge-blue">' + esc(z.procedure_type) + '</span> ' : '';
      return '<div class="card" style="cursor:pointer" onclick="go(\'/zaak/' + z.id + '\')">' +
        '<div style="display:flex;justify-content:space-between;align-items:start;gap:8px">' +
          '<div style="min-width:0;flex:1"><h3 style="font-size:15px;margin-bottom:4px">' + esc(z.naam) + '</h3>' +
          '<div style="font-size:12px;color:var(--tx3)">' + badge + z.doc_count + ' documenten</div></div>' +
          '<span class="mi" style="color:var(--tx3)">chevron_right</span></div></div>';
    }).join('');
    h += '</div></div>';
    el.innerHTML = h;
  });
}

function healthItem(icon, label, desc, color) {
  return '<div class="health-item"><span class="mi" style="color:' + color + '">' + icon + '</span><div><div class="health-label">' + label + '</div><div class="health-desc">' + desc + '</div></div></div>';
}

// ---- FOLDER BROWSER MODAL ----
var _fbCallback = null;

function openFolderBrowser(startPath, callback) {
  _fbCallback = callback || null;

  var modal = document.createElement('div');
  modal.className = 'fb-modal';
  modal.id = 'fbModal';
  modal.innerHTML = '<div class="fb-box">' +
    '<div class="fb-header"><span class="mi" style="color:var(--yellow)">folder_open</span><h3>Map kiezen</h3>' +
    '<button class="btn btn-ghost btn-sm" onclick="closeFolderBrowser()" style="margin-left:auto"><span class="mi">close</span></button></div>' +
    '<div class="fb-path" id="fbPath">Laden...</div>' +
    '<div class="fb-body" id="fbBody"><div class="loading"><div class="spinner"></div></div></div>' +
    '<div class="fb-footer">' +
      '<span class="mi" style="color:var(--yellow);font-size:18px">folder</span>' +
      '<span class="fb-selected-path" id="fbSelectedPath">Geen map geselecteerd</span>' +
      '<button class="btn btn-ghost btn-sm" id="fbSelectBtn" onclick="selectBrowsedFolder()" disabled><span class="mi">check</span> Selecteer deze map</button>' +
    '</div>' +
  '</div>';

  document.body.appendChild(modal);

  // Close on backdrop click
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeFolderBrowser();
  });

  // Load start
  browseTo(startPath || '');
}

function closeFolderBrowser() {
  var m = document.getElementById('fbModal');
  if (m) m.remove();
}

var _fbCurrentPath = '';

function browseTo(path) {
  _fbCurrentPath = path;
  var body = document.getElementById('fbBody');
  if (body) body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  apiFetch('/browse?path=' + encodeURIComponent(path), function(err, data) {
    var body = document.getElementById('fbBody');
    var pathEl = document.getElementById('fbPath');
    if (!body) return;

    if (err) { body.innerHTML = '<div style="padding:20px;color:var(--red);font-size:13px">' + esc(err) + '</div>'; return; }

    // Update path breadcrumbs
    if (pathEl) {
      if (data.shortcuts) {
        pathEl.innerHTML = '<span class="mi mi-sm">home</span> Snelkoppelingen';
      } else {
        var bc = '<span class="fb-path-seg" onclick="browseTo(\'\')"><span class="mi mi-sm">home</span></span>';
        if (data.path) {
          var sep = data.path.indexOf('\\') !== -1 ? '\\' : '/';
          var parts = data.path.split(sep);
          var built = '';
          parts.forEach(function(p, i) {
            if (!p) return;
            built += (i === 0 && sep === '\\' ? p : (built ? sep : '') + p);
            if (i === 0 && sep === '\\' && !built.endsWith('\\')) built += '\\';
            bc += ' <span style="color:var(--tx3)">' + sep + '</span> ';
            bc += '<span class="fb-path-seg" onclick="browseTo(\'' + esc(built.replace(/\\/g, '\\\\').replace(/'/g, "\\'")) + '\')">' + esc(p) + '</span>';
          });
        }
        pathEl.innerHTML = bc;
      }
    }

    // Update select button
    updateFbSelect(data.path);

    // Render items
    if (!data.items || data.items.length === 0) {
      body.innerHTML = '<div style="padding:30px;text-align:center;color:var(--tx3);font-size:13px"><span class="mi" style="display:block;font-size:32px;margin-bottom:8px;opacity:.4">folder_off</span>Lege map</div>';
      return;
    }

    var h = '';

    // Back button
    if (data.parent !== undefined && data.path) {
      h += '<div class="fb-item" onclick="browseTo(\'' + esc((data.parent || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'")) + '\')">';
      h += '<span class="mi" style="color:var(--tx3)">arrow_back</span>';
      h += '<div class="fb-item-info"><span class="fb-item-name">..</span><span class="fb-item-meta">Bovenliggende map</span></div>';
      h += '</div>';
    }

    data.items.forEach(function(item) {
      var cls = 'fb-item';
      if (item.type === 'folder') cls += ' folder';
      else if (item.type === 'drive') cls += ' drive';
      else if (item.type === 'shortcut') cls += ' shortcut';
      else if (item.type === 'file') cls += ' file' + (item.supported ? ' supported' : '');

      var icon = 'insert_drive_file';
      if (item.type === 'folder') icon = 'folder';
      else if (item.type === 'drive') icon = 'hard_drive';
      else if (item.type === 'shortcut') icon = 'bookmark';
      else if (item.supported) icon = 'description';

      var escapedPath = esc(item.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'"));

      if (item.type === 'folder' || item.type === 'drive' || item.type === 'shortcut') {
        h += '<div class="' + cls + '" onclick="browseTo(\'' + escapedPath + '\')">';
      } else {
        h += '<div class="' + cls + '">';
      }
      h += '<span class="mi">' + icon + '</span>';
      h += '<div class="fb-item-info"><span class="fb-item-name">' + esc(item.name) + '</span>';
      if (item.type === 'folder') {
        h += '<span class="fb-item-meta">' + (item.items_count || 0) + ' items</span>';
      } else if (item.type === 'file') {
        h += '<span class="fb-item-meta">' + esc(item.ext || '') + ' &middot; ' + fmtBytes(item.size) + (item.supported ? ' &middot; <span style="color:var(--green)">ondersteund</span>' : '') + '</span>';
      }
      h += '</div>';
      h += '</div>';
    });

    body.innerHTML = h;
  });
}

function updateFbSelect(path) {
  var selPath = document.getElementById('fbSelectedPath');
  var selBtn = document.getElementById('fbSelectBtn');
  if (selPath) selPath.textContent = path || 'Geen map geselecteerd';
  if (selBtn) selBtn.disabled = !path;
}

function selectBrowsedFolder() {
  _selectedFolder = _fbCurrentPath;
  closeFolderBrowser();
  toast('Map geselecteerd: ' + _selectedFolder);

  // Als er een callback is (bijv. dashboard hoofdmap), gebruik die
  if (_fbCallback) {
    _fbCallback();
    _fbCallback = null;
  } else {
    // Default: nieuwe zaak flow
    var input = document.getElementById('nzFolder');
    if (input) input.value = _selectedFolder;
    scanSelectedFolder();
  }
}

function scanSelectedFolder() {
  var el = document.getElementById('scanPreview');
  if (!el || !_selectedFolder) return;

  el.innerHTML = '<div style="padding:12px;text-align:center"><span class="spinner"></span> Map scannen op documenten...</div>';

  apiFetch('/browse/scan', { method: 'POST', body: { path: _selectedFolder } }, function(err, data) {
    if (!el) return;
    if (err) { el.innerHTML = '<div style="color:var(--red);font-size:12px">' + esc(err) + '</div>'; return; }

    if (data.total_files === 0) {
      el.innerHTML = '<div class="scan-preview"><div class="scan-header"><span class="mi" style="color:var(--tx3)">info</span><span style="font-size:13px;color:var(--tx3)">Geen ondersteunde documenten gevonden in deze map.</span></div></div>';
      return;
    }

    var h = '<div class="scan-preview">';
    h += '<div class="scan-header"><span class="mi">description</span><span style="font-size:14px;font-weight:600">' + data.total_files + ' documenten gevonden</span></div>';
    h += '<div class="scan-stats">';
    h += '<span class="scan-stat"><span class="mi">folder</span> ' + Object.keys(data.by_subfolder).length + ' mappen</span>';
    h += '<span class="scan-stat"><span class="mi">insert_drive_file</span> ' + data.total_files + ' bestanden</span>';
    h += '<span class="scan-stat"><span class="mi">data_usage</span> ' + fmtBytes(data.total_size) + '</span>';
    h += '</div>';

    // Per subfolder
    var subs = data.by_subfolder;
    Object.keys(subs).forEach(function(sub) {
      var info = subs[sub];
      h += '<div class="scan-subfolder">';
      h += '<div class="scan-subfolder-head" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'">';
      h += '<span class="mi">folder</span> ' + esc(sub) + ' <span class="count">(' + info.count + ' bestanden)</span>';
      h += '</div>';
      h += '<div style="display:none">';
      info.files.forEach(function(f) {
        h += '<div class="scan-file"><span class="mi">description</span> ' + esc(f.name) + ' <span style="color:var(--tx3)">' + fmtBytes(f.size) + '</span></div>';
      });
      h += '</div>';
      h += '</div>';
    });

    h += '</div>';

    // Auto-fill zaak naam from folder name if empty
    var nameInput = document.getElementById('nzNaam');
    if (nameInput && !nameInput.value) {
      var parts = _selectedFolder.replace(/\\/g, '/').split('/');
      var folderName = parts[parts.length - 1] || parts[parts.length - 2] || '';
      if (folderName) nameInput.value = folderName;
    }

    el.innerHTML = h;
  });
}

function createZaak() {
  var naam = document.getElementById('nzNaam').value.trim();
  if (!naam) { toast('Vul een naam in voor de zaak'); return; }

  var folder = _selectedFolder || document.getElementById('nzFolder').value.trim();
  if (!folder) {
    if (!confirm('U heeft geen map geselecteerd. Wilt u toch doorgaan zonder documenten?')) return;
  }

  apiFetch('/zaken', {
    method: 'POST',
    body: {
      naam: naam,
      wederpartij: document.getElementById('nzWederpartij').value.trim(),
      instantie: document.getElementById('nzInstantie').value.trim(),
      omschrijving: document.getElementById('nzOmschrijving').value.trim(),
      folder_path: folder,
    }
  }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    var docCount = (data.documenten || []).length;
    toast('Zaak aangemaakt! ' + (docCount ? docCount + ' documenten geimporteerd.' : ''));
    go('/zaak/' + data.id);
  });
}

// ---- ZAAK DETAIL ----
function pgZaak(id) {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  apiFetch('/zaken/' + id, function(err, zaak, ok) {
    if (err || !ok) { app.innerHTML = '<div class="empty-state">Zaak niet gevonden</div>'; return; }
    renderZaak(zaak);
  });
}

  h += '<button class="tab" data-tab="anon" onclick="switchTab(this,\'' + z.id + '\')"><span class="mi">security</span> Anonimisering</button>';

  h += '<button class="tab" data-tab="meldpunt" onclick="switchTab(this,\'' + z.id + '\')"><span class="mi">flag</span> Meldpunt</button>';
  h += '<button class="tab" data-tab="chat" onclick="switchTab(this,\'' + z.id + '\')"><span class="mi">chat</span> AI Advies</button>';

  h += '<div id="tabContent"></div>';

  app.innerHTML = h;

  var h = '';
  var hasAnon = (z.documenten || []).some(function(d) { return d.has_anonymized; });
  var isStale = z.samenvatting && z.doc_count !== z.samenvatting_doc_count;

  if (z.samenvatting) {
    h += '<div class="samenvatting-card' + (isStale ? ' samenvatting-stale' : '') + '" id="samenvattingCard">';
    h += '<h3><span class="mi" style="color:var(--accent)">article</span> Samenvatting';
    if (isStale) {
      h += ' <span class="badge" style="background:rgba(234,179,8,.15);color:#eab308;font-size:11px"><span class="mi" style="font-size:12px">warning</span> Verouderd — documenten gewijzigd</span>';
    }
    h += '</h3>';
    h += '<div class="samenvatting-body" id="samenvattingBody">' + esc(z.samenvatting) + '</div>';
    h += '<div class="samenvatting-meta">Bijgewerkt: ' + fmtDateTime(z.samenvatting_updated_at) + ' &middot; ' + z.samenvatting_doc_count + ' documenten verwerkt</div>';
    h += '<div class="samenvatting-actions">';
    h += '<button class="btn btn-ghost btn-sm" onclick="editSamenvatting(\'' + z.id + '\')"><span class="mi">edit</span> Bewerken</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="generateSamenvatting(\'' + z.id + '\')"><span class="mi">refresh</span> Opnieuw genereren</button>';
    h += '</div></div>';
  } else if (hasAnon) {
    h += '<div class="samenvatting-card" id="samenvattingCard" style="border-style:dashed">';
    h += '<h3><span class="mi" style="color:var(--tx3)">article</span> Samenvatting</h3>';
    h += '<p style="color:var(--tx3);font-size:14px">Er is nog geen samenvatting. Genereer een AI-samenvatting van alle geanonimiseerde documenten.</p>';
    h += '<div class="samenvatting-actions">';
    h += '<button class="btn btn-blue btn-sm" onclick="generateSamenvatting(\'' + z.id + '\')"><span class="mi">auto_awesome</span> Genereer samenvatting</button>';
    h += '</div></div>';
  } else if (z.omschrijving && z.omschrijving.length > 20) {
    // Toon omschrijving als samenvatting (bijv. handmatig of via Claude ingeladen)
    h += '<div class="samenvatting-card" id="samenvattingCard">';
    h += '<h3><span class="mi" style="color:var(--accent)">article</span> Samenvatting</h3>';
    h += '<div class="samenvatting-body" style="white-space:pre-wrap;font-size:13px;line-height:1.6">' + esc(z.omschrijving) + '</div>';
    h += '<div class="samenvatting-actions">';
    h += '<button class="btn btn-ghost btn-sm" onclick="editSamenvatting(\'' + z.id + '\')"><span class="mi">edit</span> Bewerken</button>';
    h += '</div></div>';
  } else if ((z.documenten || []).length > 0) {
    h += '<div class="samenvatting-card" id="samenvattingCard" style="border-style:dashed;border-color:var(--tx3)">';
    h += '<h3><span class="mi" style="color:var(--tx3)">article</span> Samenvatting</h3>';
    h += '<p style="color:var(--tx3);font-size:14px">Klik op een document om de samenvatting te bekijken, of genereer een AI-samenvatting.</p>';
    h += '<div class="samenvatting-actions">';
    h += '<button class="btn btn-blue btn-sm" onclick="generateSamenvatting(\'' + z.id + '\')"><span class="mi">auto_awesome</span> Genereer samenvatting</button>';
    h += '</div></div>';
  }
  return h;
}

function generateSamenvatting(zaakId) {
  toast('Samenvatting genereren...');
  var card = document.getElementById('samenvattingCard');
  if (card) card.innerHTML = '<div class="loading"><div class="spinner"></div> Samenvatting genereren... Dit kan even duren.</div>';
  apiFetch('/zaken/' + zaakId + '/samenvatting', { method: 'POST', body: {} }, function(err, data, ok) {
    if (err || !ok) {
      toast('Fout: ' + (err || data.error));
      if (card) card.innerHTML = '<div style="color:var(--red)">' + esc(err || data.error) + '</div>';
      return;
    }
    toast('Samenvatting gegenereerd!');
    pgZaak(zaakId);
  });
}

function editSamenvatting(zaakId) {
  var body = document.getElementById('samenvattingBody');
  var card = document.getElementById('samenvattingCard');
  if (!body || !card) return;
  var currentText = body.textContent;
  var h = '<h3><span class="mi" style="color:var(--accent)">edit</span> Samenvatting bewerken</h3>';
  h += '<textarea id="samenvattingEdit" style="width:100%;min-height:200px;font-size:14px;line-height:1.7;padding:12px;border:1px solid var(--glass-bd);border-radius:8px;background:var(--bg2);color:var(--tx1);font-family:inherit;resize:vertical">' + esc(currentText) + '</textarea>';
  h += '<div class="samenvatting-actions">';
  h += '<button class="btn btn-blue btn-sm" onclick="saveSamenvatting(\'' + zaakId + '\')"><span class="mi">save</span> Opslaan</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="pgZaak(\'' + zaakId + '\')"><span class="mi">close</span> Annuleren</button>';
  h += '</div>';
  card.innerHTML = h;
}

function saveSamenvatting(zaakId) {
  var ta = document.getElementById('samenvattingEdit');
  if (!ta) return;
  var tekst = ta.value.trim();
  if (!tekst) { toast('Samenvatting mag niet leeg zijn.'); return; }
  toast('Samenvatting opslaan...');
  apiFetch('/zaken/' + zaakId + '/samenvatting', { method: 'PUT', body: { samenvatting: tekst } }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast('Samenvatting opgeslagen!');
    pgZaak(zaakId);
  });
}

function switchTab(btn, zaakId) {
  document.querySelectorAll('#zaakTabs .tab').forEach(function(t){ t.classList.remove('active'); });
  btn.classList.add('active');
  var tab = btn.dataset.tab;
  if (tab === 'docs') apiFetch('/zaken/' + zaakId, function(e,z){ if(!e) renderDocsTab(z); });
  else if (tab === 'anon') renderAnonTab(zaakId);
  else if (tab === 'analyse') renderAnalyseTab(zaakId);
  else if (tab === 'tijdlijn') renderTimelineTab(zaakId);
  else if (tab === 'meldpunt') renderMeldpuntTab(zaakId);
  else if (tab === 'chat') renderChatTab(zaakId);
}

var _selectedDocs = {};

function renderDocsTab(z) {
  var tc = document.getElementById('tabContent');
  if (!tc) return;
  var docs = z.documenten || [];
  var selectedCount = Object.keys(_selectedDocs).filter(function(k){ return _selectedDocs[k]; }).length;

  var h = '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">';
  h += '<button class="btn btn-blue btn-sm" onclick="extractAll(\'' + z.id + '\')"><span class="mi">text_snippet</span> Alles extraheren</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="addDocsByPath(\'' + z.id + '\')"><span class="mi">add</span> Bestanden toevoegen</button>';
  h += '<span style="border-left:1px solid var(--bd);height:20px;margin:0 4px"></span>';
  h += '<button class="btn btn-ghost btn-sm" onclick="toggleSelectAll(\'' + z.id + '\',' + docs.length + ')"><span class="mi">select_all</span> Selecteer alles</button>';
  if (selectedCount > 0) {
    h += '<span style="font-size:12px;color:var(--accent);font-weight:600">' + selectedCount + ' geselecteerd</span>';
    h += '<button class="btn btn-ghost btn-sm" style="color:var(--accent)" onclick="showCopyModal(\'' + z.id + '\')"><span class="mi">content_copy</span> Kopieer naar...</button>';
    h += '<button class="btn btn-ghost btn-sm" style="color:#f97316" onclick="showMoveModal(\'' + z.id + '\')"><span class="mi">drive_file_move</span> Verplaats naar...</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="_selectedDocs={};apiFetch(\'/zaken/\'+\'' + z.id + '\',function(e,z){if(!e)renderDocsTab(z)})"><span class="mi">deselect</span> Deselecteer</button>';
  }
  h += '</div>';

  // Sorteer op datum (nieuwste eerst)
  docs.sort(function(a, b) {
    var dateA = a.doc_datum || a.file_modified || '0000';
    var dateB = b.doc_datum || b.file_modified || '0000';
    return dateB.localeCompare(dateA);
  });

  if (!docs.length) {
    h += '<div class="empty-state"><span class="mi">folder_open</span><p>Geen documenten. Voeg bestanden toe of stel een map in.</p></div>';
  } else {
    docs.forEach(function(d) {
      h += renderDocCard(d, z.id);
    });
  }
  tc.innerHTML = h;
}

function toggleSelectAll(zaakId, count) {
  var allSelected = Object.keys(_selectedDocs).filter(function(k){ return _selectedDocs[k]; }).length >= count;
  if (allSelected) {
    _selectedDocs = {};
  } else {
    document.querySelectorAll('.doc-checkbox').forEach(function(cb) {
      _selectedDocs[cb.dataset.docid] = true;
      cb.checked = true;
    });
  }
  apiFetch('/zaken/' + zaakId, function(e, z) { if (!e) renderDocsTab(z); });
}

function toggleDocSelect(docId, zaakId) {
  _selectedDocs[docId] = !_selectedDocs[docId];
  var selectedCount = Object.keys(_selectedDocs).filter(function(k){ return _selectedDocs[k]; }).length;
  // Update toolbar without full re-render
  apiFetch('/zaken/' + zaakId, function(e, z) { if (!e) renderDocsTab(z); });
}

function showCopyModal(zaakId) {
  var selected = Object.keys(_selectedDocs).filter(function(k){ return _selectedDocs[k]; });
  if (!selected.length) { toast('Selecteer eerst bestanden'); return; }

  var modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999';
  modal.id = 'copyModal';
  modal.onclick = function(e) { if (e.target === modal) modal.remove(); };

  var box = '<div style="background:var(--bg);border-radius:12px;padding:24px;width:500px;max-height:80vh;overflow-y:auto">';
  box += '<h3 style="margin-bottom:16px"><span class="mi" style="color:var(--accent)">content_copy</span> Kopieer ' + selected.length + ' bestanden naar...</h3>';
  box += '<div style="margin-bottom:12px">';
  box += '<label style="font-size:12px;color:var(--tx3)">Kies bestaande map of maak een nieuwe:</label>';
  box += '<div id="copyFolderBrowser" style="margin-top:8px"><div class="loading"><div class="spinner"></div></div></div>';
  box += '</div>';
  box += '<div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">';
  box += '<input id="newFolderName" class="form-input" style="flex:1;padding:8px 12px" placeholder="Of typ een naam voor een nieuwe map...">';
  box += '<button class="btn btn-ghost btn-sm" onclick="createAndCopy(\'' + zaakId + '\')"><span class="mi">create_new_folder</span> Maak aan</button>';
  box += '</div>';
  box += '<div style="display:flex;gap:8px;justify-content:flex-end">';
  box += '<button class="btn btn-ghost" onclick="document.getElementById(\'copyModal\').remove()">Annuleren</button>';
  box += '</div></div>';

  modal.innerHTML = box;
  document.body.appendChild(modal);

  // Laad beschikbare mappen
  apiFetch('/browse/list?path=' + encodeURIComponent(document.querySelector('[data-hoofdmap]')?.dataset?.hoofdmap || ''), function(err, data) {
    var el = document.getElementById('copyFolderBrowser');
    if (!el) return;
    // Toon zaken als mappen
    apiFetch('/zaken', function(err2, zaken) {
      var h = '';
      (zaken || []).forEach(function(z) {
        if (z.folder_path) {
          h += '<div class="card" style="padding:8px 12px;margin-bottom:4px;cursor:pointer;font-size:13px" onclick="doCopyToFolder(\'' + zaakId + '\',\'' + esc(z.folder_path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")) + '\')">';
          h += '<span class="mi" style="color:var(--yellow);font-size:16px;vertical-align:-3px">folder</span> ' + esc(z.naam);
          h += '</div>';
        }
      });
      el.innerHTML = h || '<p style="color:var(--tx3);font-size:12px">Geen mappen gevonden</p>';
    });
  });
}

function showMoveModal(zaakId) {
  // Zelfde als copy maar met verplaatsen
  showCopyModal(zaakId);
  var h3 = document.querySelector('#copyModal h3');
  if (h3) h3.innerHTML = '<span class="mi" style="color:#f97316">drive_file_move</span> Verplaats bestanden naar...';
}

function doCopyToFolder(zaakId, targetPath) {
  var selected = Object.keys(_selectedDocs).filter(function(k){ return _selectedDocs[k]; });
  if (!selected.length) return;
  toast('Bestanden kopieren...');
  apiFetch('/documenten/batch-copy', {
    method: 'POST',
    body: { doc_ids: selected, target_path: targetPath }
  }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast(data.copied + ' bestanden gekopieerd!');
    _selectedDocs = {};
    var modal = document.getElementById('copyModal');
    if (modal) modal.remove();
    apiFetch('/zaken/' + zaakId, function(e, z) { if (!e) renderDocsTab(z); });
  });
}

function createAndCopy(zaakId) {
  var name = document.getElementById('newFolderName');
  if (!name || !name.value.trim()) { toast('Geef een mapnaam op'); return; }
  var folderName = name.value.trim();

  var selected = Object.keys(_selectedDocs).filter(function(k){ return _selectedDocs[k]; });
  if (!selected.length) { toast('Selecteer eerst bestanden'); return; }

  toast('Map aanmaken en bestanden kopieren...');
  apiFetch('/documenten/batch-copy', {
    method: 'POST',
    body: { doc_ids: selected, new_folder_name: folderName }
  }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast(data.copied + ' bestanden gekopieerd naar ' + folderName + '!');
    _selectedDocs = {};
    var modal = document.getElementById('copyModal');
    if (modal) modal.remove();
    apiFetch('/zaken/' + zaakId, function(e, z) { if (!e) renderDocsTab(z); });
  });
}

function renderDocCard(d, zaakId) {
  var typeIcon = {
    'brief':'mail','email':'email','beschikking':'assignment','bezwaarschrift':'edit_document',

    'uitspraak':'gavel','verzoek':'request_page','factuur':'receipt','rapport':'summarize',

  };

    h += '<div style="min-width:75px;text-align:center;margin-top:2px">';
    h += '<div style="font-size:11px;font-weight:700;color:var(--accent);background:rgba(59,130,246,.1);padding:3px 8px;border-radius:6px">' + datum + '</div>';

  }

  h += '<span class="mi" style="font-size:22px;color:var(--accent);margin-top:2px">' + icon + '</span>';
  h += '<div style="flex:1;min-width:0">';
