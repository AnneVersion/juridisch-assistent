  // Meta line — compact single-line with middot separators
  var metaParts = [];
  metaParts.push(esc(d.bestandstype) + ' · ' + fmtBytes(d.bestandsgrootte));
  if (d.doc_datum) metaParts.push('<span class="mi" style="font-size:12px;vertical-align:-2px">event</span> ' + esc(d.doc_datum));
  if (d.doc_afzender) metaParts.push('Van: ' + esc(d.doc_afzender));
  if (d.doc_ontvanger) metaParts.push('Aan: ' + esc(d.doc_ontvanger));
  if (d.doc_kenmerk) metaParts.push(esc(d.doc_kenmerk));
  if (d.file_modified) metaParts.push('<span class="mi" style="font-size:12px;vertical-align:-2px">edit_calendar</span> ' + esc(d.file_modified));
  metaParts.push(d.extraction_done ? '<span style="color:var(--green)">✓ tekst</span>' : 'geen tekst');
  if (d.has_anonymized) metaParts.push('<span style="color:var(--green)"><span class="mi" style="font-size:12px;vertical-align:-2px">security</span> geanonimiseerd</span>');
  if (d.has_samenvatting) metaParts.push('<span style="color:var(--green)"><span class="mi" style="font-size:12px;vertical-align:-2px">check_circle</span> samenvatting' + (d.samenvatting_at ? ' · ' + fmtDateTime(d.samenvatting_at) : '') + '</span>');
  h += '<div style="font-size:11px;color:var(--tx3);margin-top:3px;line-height:1.6">' + metaParts.join(' &nbsp;·&nbsp; ') + '</div>';

  if (d.doc_onderwerp) {
    h += '<div style="font-size:12px;color:var(--tx2);margin-top:4px">' + esc(d.doc_onderwerp) + '</div>';
  }
  if (d.doc_notities) {
    h += '<div style="font-size:11px;color:var(--tx3);margin-top:2px;font-style:italic">' + esc(d.doc_notities) + '</div>';
  }

  // Samenvatting direct zichtbaar
  if (d.samenvatting && d.samenvatting.length > 5) {
    h += '<div style="font-size:11px;color:var(--tx2);margin-top:6px;padding:6px 10px;background:rgba(59,130,246,.05);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;line-height:1.5">';
    h += esc(d.samenvatting.length > 200 ? d.samenvatting.substring(0, 200) + '...' : d.samenvatting);
    h += '</div>';
  }

  h += '</div>'; // flex:1

  // Action buttons
  h += '<div style="display:flex;gap:4px;flex-shrink:0">';
  h += '<button class="btn btn-ghost btn-sm" onclick="event.preventDefault();toggleMetaEdit(\'' + d.id + '\',\'' + zaakId + '\')" title="Metadata bewerken"><span class="mi">edit</span></button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="event.preventDefault();extractDoc(\'' + d.id + '\',\'' + zaakId + '\')" title="Tekst extraheren"><span class="mi">text_snippet</span></button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="event.preventDefault();go(\'/anonimiseer/' + d.id + '\')" title="Anonimiseren"><span class="mi">security</span></button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="event.preventDefault();generateDocSamenvatting(\'' + d.id + '\',\'' + zaakId + '\')" title="Samenvatten"><span class="mi">auto_awesome</span></button>';
  h += '</div>';
  h += '</div>'; // top row

  // Samenvatting panel (zichtbaar als er een samenvatting is)
  if (d.has_samenvatting) {
    h += '<div id="docSamenvatting_' + d.id + '" style="border-top:1px solid var(--glass-bd);padding-top:10px;margin-top:8px">';
    h += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
    h += '<span class="mi" style="font-size:16px;color:var(--green)">check_circle</span>';
    h += '<span style="font-size:12px;font-weight:600;color:var(--tx2)">Samenvatting</span>';
    if (d.samenvatting_at) h += '<span style="font-size:11px;color:var(--tx3)">' + fmtDateTime(d.samenvatting_at) + '</span>';
    h += '<span style="flex:1"></span>';
    h += '<button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="event.preventDefault();toggleDocSamenvatting(\'' + d.id + '\')" title="In-/uitklappen"><span class="mi" id="docSamToggle_' + d.id + '">expand_less</span></button>';
    h += '<button class="btn btn-ghost btn-sm" style="padding:2px 6px" onclick="event.preventDefault();generateDocSamenvatting(\'' + d.id + '\',\'' + zaakId + '\')" title="Opnieuw genereren"><span class="mi" style="font-size:16px">refresh</span></button>';
    h += '</div>';
    h += '<div id="docSamBody_' + d.id + '" style="font-size:13px;color:var(--tx2);line-height:1.7;white-space:pre-wrap;max-height:300px;overflow-y:auto;padding:8px 10px;background:var(--bg2);border-radius:var(--rs)">' + esc(d.samenvatting) + '</div>';
    h += '</div>';
  }

  // Samenvatting loading placeholder
  h += '<div id="docSamLoading_' + d.id + '" style="display:none;border-top:1px solid var(--glass-bd);padding:12px 0;margin-top:8px;text-align:center">';
  h += '<div class="spinner" style="margin-right:8px;vertical-align:-4px"></div> <span style="font-size:13px;color:var(--tx3)">Samenvatting genereren...</span>';
  h += '</div>';

  // Editable metadata form (hidden by default)
  h += '<div id="metaEdit_' + d.id + '" style="display:none;border-top:1px solid var(--glass-bd);padding-top:12px;margin-top:4px">';
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">';

  // Type
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Type document</label>';
  h += '<select class="form-input" id="meta_type_' + d.id + '" style="padding:6px 10px;font-size:12px">';
  DOC_TYPES.forEach(function(t){ h += '<option value="' + t.v + '"' + (d.doc_type===t.v?' selected':'') + '>' + t.l + '</option>'; });
  h += '</select></div>';

  // Datum
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Datum document</label>';
  h += '<input class="form-input" id="meta_datum_' + d.id + '" value="' + esc(d.doc_datum) + '" type="date" style="padding:6px 10px;font-size:12px"></div>';

  // Richting
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Richting</label>';
  h += '<select class="form-input" id="meta_richting_' + d.id + '" style="padding:6px 10px;font-size:12px">';
  DOC_RICHTINGEN.forEach(function(r){ h += '<option value="' + r.v + '"' + (d.doc_richting===r.v?' selected':'') + '>' + r.l + '</option>'; });
  h += '</select></div>';

  h += '</div>'; // grid row 1

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';

  // Afzender
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Afzender (van)</label>';
  h += '<input class="form-input" id="meta_afzender_' + d.id + '" value="' + esc(d.doc_afzender) + '" placeholder="Bijv. Gemeente, Belastingdienst" style="padding:6px 10px;font-size:12px"></div>';

  // Ontvanger
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Ontvanger (aan)</label>';
  h += '<input class="form-input" id="meta_ontvanger_' + d.id + '" value="' + esc(d.doc_ontvanger) + '" placeholder="Bijv. uw naam" style="padding:6px 10px;font-size:12px"></div>';

  h += '</div>'; // grid row 2

  h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';

  // Kenmerk
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Kenmerk / Referentie</label>';
  h += '<input class="form-input" id="meta_kenmerk_' + d.id + '" value="' + esc(d.doc_kenmerk) + '" placeholder="Referentienummer" style="padding:6px 10px;font-size:12px"></div>';

  // Onderwerp
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Onderwerp</label>';
  h += '<input class="form-input" id="meta_onderwerp_' + d.id + '" value="' + esc(d.doc_onderwerp) + '" placeholder="Kort onderwerp" style="padding:6px 10px;font-size:12px"></div>';

  h += '</div>'; // grid row 3

  // Notities
  h += '<div class="form-group" style="margin-bottom:8px"><label class="form-label" style="font-size:11px">Notities</label>';
  h += '<input class="form-input" id="meta_notities_' + d.id + '" value="' + esc(d.doc_notities) + '" placeholder="Eigen aantekeningen..." style="padding:6px 10px;font-size:12px"></div>';

  // Save/cancel
  h += '<div style="display:flex;gap:6px;margin-top:4px">';
  h += '<button class="btn btn-blue btn-sm" onclick="saveDocMeta(\'' + d.id + '\',\'' + zaakId + '\')"><span class="mi">save</span> Opslaan</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="toggleMetaEdit(\'' + d.id + '\')">Annuleren</button>';
  h += '</div>';

  h += '</div>'; // metaEdit
  h += '</div>'; // card
  return h;
}

function toggleMetaEdit(docId) {
  var el = document.getElementById('metaEdit_' + docId);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function saveDocMeta(docId, zaakId) {
  var body = {
    doc_type: document.getElementById('meta_type_' + docId).value,
    doc_datum: document.getElementById('meta_datum_' + docId).value,
    doc_richting: document.getElementById('meta_richting_' + docId).value,
    doc_afzender: document.getElementById('meta_afzender_' + docId).value,
    doc_ontvanger: document.getElementById('meta_ontvanger_' + docId).value,
    doc_kenmerk: document.getElementById('meta_kenmerk_' + docId).value,
    doc_onderwerp: document.getElementById('meta_onderwerp_' + docId).value,
    doc_notities: document.getElementById('meta_notities_' + docId).value,
  };
  apiFetch('/documenten/' + docId + '/metadata', { method: 'PUT', body: body }, function(err, data, ok) {
    if (err || !ok) { toast('Fout bij opslaan'); return; }
    toast('Metadata opgeslagen!');
    // Herlaad zaak om documenten opnieuw te renderen
    apiFetch('/zaken/' + zaakId, function(e,z){ if(!e) renderDocsTab(z); });
  });
}

function extractDoc(docId, zaakId) {
  toast('Tekst extraheren...');
  apiFetch('/documenten/' + docId + '/extract', { method: 'POST' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast('Geextraheerd: ' + data.text_length + ' tekens (' + data.method + ')');
    apiFetch('/zaken/' + zaakId, function(e,z){ if(!e) renderDocsTab(z); });
  });
}

function extractAll(zaakId) {
  toast('Alle documenten extraheren...');
  apiFetch('/zaken/' + zaakId + '/extract-all', { method: 'POST' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    var done = data.results.filter(function(r){ return r.status === 'ok'; }).length;
    toast(done + ' documenten geextraheerd');
    apiFetch('/zaken/' + zaakId, function(e,z){ if(!e) renderDocsTab(z); });
  });
}

function generateDocSamenvatting(docId, zaakId) {
  var loading = document.getElementById('docSamLoading_' + docId);
  if (loading) {
    loading.style.display = '';
    loading.innerHTML = '<div style="text-align:left;padding:8px 10px;font-size:13px;color:var(--tx2)">' +
      '<div id="step_ext_' + docId + '" style="margin-bottom:4px"><span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px;vertical-align:-2px"></span> Tekst extraheren...</div>' +
      '<div id="step_anon_' + docId + '" style="margin-bottom:4px;opacity:.4"><span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--tx3)">hourglass_empty</span> Anonimiseren</div>' +
      '<div id="step_sam_' + docId + '" style="opacity:.4"><span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--tx3)">hourglass_empty</span> Samenvatten met AI</div>' +
      '</div>';
  }
  toast('Pipeline gestart: extraheren → anonimiseren → samenvatten');

  // Animeer stappen
  setTimeout(function() {
    var s1 = document.getElementById('step_ext_' + docId);
    if (s1) s1.innerHTML = '<span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--green)">check_circle</span> Tekst extraheren';
    var s2 = document.getElementById('step_anon_' + docId);
    if (s2) { s2.style.opacity = '1'; s2.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px;vertical-align:-2px"></span> Anonimiseren...'; }
  }, 2000);
  setTimeout(function() {
    var s2 = document.getElementById('step_anon_' + docId);
    if (s2) s2.innerHTML = '<span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--green)">check_circle</span> Anonimiseren';
    var s3 = document.getElementById('step_sam_' + docId);
    if (s3) { s3.style.opacity = '1'; s3.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px;vertical-align:-2px"></span> Samenvatten met AI... (kan even duren)'; }
  }, 4000);

  apiFetch('/documenten/' + docId + '/samenvatting', { method: 'POST', body: {} }, function(err, data, ok) {
    if (loading) loading.style.display = 'none';
    if (err || !ok) {
      var errMsg = err || (data && data.error) || 'Onbekende fout';
      toast('Fout: ' + errMsg);
      if (loading) {
        loading.style.display = '';
        loading.innerHTML = '<div style="padding:8px 10px;font-size:13px;color:var(--red)"><span class="mi" style="font-size:14px;vertical-align:-2px">error</span> ' + esc(errMsg) + '</div>';
      }
      // Toon welke stappen wel gelukt zijn
      if (data && data.steps) {
        var stepsHtml = '';
        data.steps.forEach(function(s) {
          var icon = s.status === 'ok' ? '<span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--green)">check_circle</span>' :
                     s.status === 'al_gedaan' ? '<span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--tx3)">check</span>' :
                     '<span class="mi" style="font-size:14px;vertical-align:-2px;color:var(--yellow)">warning</span>';
          stepsHtml += '<div style="margin-bottom:2px">' + icon + ' ' + esc(s.step) + ': ' + esc(s.detail) + '</div>';
        });
        if (loading) loading.innerHTML += '<div style="padding:4px 10px;font-size:12px;color:var(--tx3)">' + stepsHtml + '</div>';
      }
      // Herlaad toch om extractie/anonimisering status te tonen
      apiFetch('/zaken/' + zaakId, function(e,z){ if(!e) renderDocsTab(z); });
      return;
    }

    // Succes: toon stappen
    var stepsMsg = (data.steps || []).map(function(s) {
      var icon = s.status === 'ok' ? '✓' : s.status === 'al_gedaan' ? '—' : '⚠';
      return icon + ' ' + s.step;
    }).join('  ');
    toast('Klaar! ' + stepsMsg);
    apiFetch('/zaken/' + zaakId, function(e,z){ if(!e) renderDocsTab(z); });
  });
}

function toggleDocSamenvatting(docId) {
  var body = document.getElementById('docSamBody_' + docId);
  var icon = document.getElementById('docSamToggle_' + docId);
  if (!body) return;
  if (body.style.display === 'none') {
    body.style.display = '';
    if (icon) icon.textContent = 'expand_less';
  } else {
    body.style.display = 'none';
    if (icon) icon.textContent = 'expand_more';
  }
}

function scanFolder(zaakId) {
  toast('Map scannen...');
  apiFetch('/zaken/' + zaakId + '/scan-folder', { method: 'POST' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }

    var msg = '';
    if (data.added_count) msg += data.added_count + ' nieuwe documenten gevonden. ';
    if (data.removed_count) msg += data.removed_count + ' verwijderde documenten opgeruimd. ';
    if (data.extracted) msg += data.extracted + ' teksten geextraheerd. ';
    if (!msg) msg = 'Geen wijzigingen gevonden.';
    toast(msg);

    // Als er nieuwe documenten zijn: bied AI analyse aan
    if (data.needs_ai_refresh && data.added_count > 0) {
      setTimeout(function() {
        if (confirm('Er zijn ' + data.added_count + ' nieuwe documenten gevonden en de tekst is geextraheerd.\n\nWil je Claude de zaak opnieuw laten analyseren?\n(Samenvatting, tijdlijn, advies en jurisprudentie worden bijgewerkt)')) {
          aiRefreshZaak(zaakId);
        } else {
          go('/zaak/' + zaakId);
        }
      }, 500);
    } else {
      go('/zaak/' + zaakId);
    }
  });
}

function addDocsByPath(zaakId) {
  var path = prompt('Voer het pad in naar een bestand of map:');
  if (!path) return;
  apiFetch('/zaken/' + zaakId + '/documenten', { method: 'POST', body: { paths: [path] } }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast(data.count + ' document(en) toegevoegd');
    go('/zaak/' + zaakId);
  });
}

function deleteZaak(zaakId) {
  if (!confirm('Weet u zeker dat u deze zaak wilt verwijderen? De bestanden op schijf worden NIET verwijderd.')) return;
  apiFetch('/zaken/' + zaakId, { method: 'DELETE' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast('Zaak verwijderd');
    go('/');
  });
}

// ---- ANON TAB ----
function renderAnonTab(zaakId) {
  var tc = document.getElementById('tabContent');
  tc.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  apiFetch('/zaken/' + zaakId + '/documenten', function(err, docs) {
    if (err) { tc.innerHTML = '<p>Fout bij laden</p>'; return; }
    var h = '<div style="display:flex;gap:8px;margin-bottom:16px">';
    h += '<button class="btn btn-blue btn-sm" onclick="anonAll(\'' + zaakId + '\',true)"><span class="mi">security</span> Alles anonimiseren (Ollama)</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="anonAll(\'' + zaakId + '\',false)"><span class="mi">security</span> Alleen regex</button>';
    h += '</div>';
    if (!docs.length) { h += '<p style="color:var(--tx3)">Geen documenten om te anonimiseren.</p>'; }
    else {
      docs.forEach(function(d) {
        var icon = d.anonymization_reviewed ? '&#10003; Goedgekeurd' : d.has_anonymized ? '&#9888; Review nodig' : '— Niet geanonimiseerd';
        var color = d.anonymization_reviewed ? 'var(--green)' : d.has_anonymized ? 'var(--yellow)' : 'var(--tx3)';
        var piiCount = d.pii_count || 0;
        h += '<div class="card" style="margin-bottom:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center">';
        h += '<div><span style="font-weight:600;font-size:14px">' + esc(d.bestandsnaam) + '</span>';
        h += ' <span style="color:' + color + ';font-size:12px;margin-left:8px">' + icon + '</span>';
        if (piiCount > 0) h += ' <span class="badge badge-purple" style="font-size:10px;margin-left:6px">' + piiCount + ' PII</span>';
        h += '</div>';
        h += '<button class="btn btn-ghost btn-sm" onclick="go(\'/anonimiseer/' + d.id + '\')"><span class="mi">edit</span> Review</button>';
        h += '</div>';
      });
    }
    tc.innerHTML = h;
  });
}

function anonAll(zaakId, useOllama) {
  var tc = document.getElementById('tabContent');
  // Toon voortgang
  var h = '<div class="card" style="padding:20px;text-align:center">';
  h += '<div class="loading"><div class="spinner"></div></div>';
  h += '<p style="font-size:15px;font-weight:600;margin-top:12px">Documenten anonimiseren...</p>';
  h += '<p style="color:var(--tx3);font-size:13px">' + (useOllama ? 'Ollama AI + regex patronen' : 'Alleen regex patronen') + '</p>';
  h += '<div id="anonProgress" style="margin-top:12px;color:var(--tx3);font-size:13px">Even geduld, dit kan even duren bij grote documenten.</div>';
  h += '</div>';
  tc.innerHTML = h;

  apiFetch('/zaken/' + zaakId + '/anonymize-all', { method: 'POST', body: { use_ollama: useOllama } }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); tc.innerHTML = '<div style="color:var(--red);padding:16px">' + esc(err || data.error) + '</div>'; return; }

    var results = data.results || [];
    var done = results.filter(function(r){ return r.status === 'ok'; }).length;
    var skipped = results.filter(function(r){ return r.status === 'no_text'; }).length;
    var totalPii = results.reduce(function(sum, r){ return sum + (r.pii_count || 0); }, 0);

    // Toon resultaat overzicht
    var rh = '<div class="card" style="padding:20px;border-color:var(--green)">';
    rh += '<h3 style="font-size:16px;color:var(--green);margin-bottom:12px"><span class="mi" style="vertical-align:middle">check_circle</span> Anonimisering voltooid!</h3>';
    rh += '<div style="display:flex;gap:24px;margin-bottom:16px">';
    rh += '<div><span style="font-size:24px;font-weight:800;color:var(--tx1)">' + done + '</span><br><span style="font-size:12px;color:var(--tx3)">documenten verwerkt</span></div>';
    rh += '<div><span style="font-size:24px;font-weight:800;color:var(--purple)">' + totalPii + '</span><br><span style="font-size:12px;color:var(--tx3)">PII gevonden</span></div>';
    if (skipped > 0) rh += '<div><span style="font-size:24px;font-weight:800;color:var(--yellow)">' + skipped + '</span><br><span style="font-size:12px;color:var(--tx3)">overgeslagen (geen tekst)</span></div>';
    if (data.new_rules_saved > 0) rh += '<div><span style="font-size:24px;font-weight:800;color:var(--accent)">' + data.new_rules_saved + '</span><br><span style="font-size:12px;color:var(--tx3)">nieuwe regels opgeslagen</span></div>';
    rh += '</div>';

    // Per document details
    rh += '<table style="font-size:13px;margin-top:8px;width:100%;border-collapse:collapse">';
    results.forEach(function(r) {
      var naam = r.bestandsnaam || r.id;
      if (r.status === 'ok') {
        rh += '<tr style="border-bottom:1px solid var(--glass-bd)">';
        rh += '<td style="padding:6px 8px 6px 0;width:20px"><span class="mi" style="font-size:14px;color:var(--green)">check_circle</span></td>';
        rh += '<td style="padding:6px 0">' + esc(naam) + '</td>';
        rh += '<td style="padding:6px 0;text-align:right">';
        if (r.pii_count > 0) rh += '<span class="badge badge-purple" style="font-size:10px">' + r.pii_count + ' PII</span>';
        rh += '</td></tr>';
      } else if (r.status === 'no_text') {
        rh += '<tr style="border-bottom:1px solid var(--glass-bd);color:var(--tx3)">';
        rh += '<td style="padding:6px 8px 6px 0;width:20px"><span class="mi" style="font-size:14px;color:var(--red)">error</span></td>';
        rh += '<td style="padding:6px 0">' + esc(naam) + '</td>';
        rh += '<td style="padding:6px 0;text-align:right;font-size:11px;color:var(--red)">' + esc(r.error || 'geen tekst') + '</td></tr>';
      }
    });
    rh += '</table>';

    rh += '<div style="margin-top:16px;display:flex;gap:8px">';
    rh += '<button class="btn btn-blue btn-sm" onclick="renderAnonTab(\'' + zaakId + '\')"><span class="mi">list</span> Bekijk documenten</button>';
    rh += '</div></div>';

    tc.innerHTML = rh;
    toast(done + ' documenten geanonimiseerd!');
  });
}

// ---- ANON REVIEW PAGE ----

function renderAnonReview(d) {
  var app = document.getElementById('app');
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  h += '<div class="section-title" style="margin-bottom:0"><span class="mi">security</span> Anonimisering: ' + esc(d.bestandsnaam) + '</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<button class="btn btn-green btn-sm" onclick="approveAnon(\'' + d.id + '\')"><span class="mi">check</span> Goedkeuren</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="history.back()">Terug</button>';
  h += '</div></div>';

  // Stats
  if (d.stats && d.stats.total > 0) {
    h += '<div class="card" style="margin-bottom:16px;padding:12px 16px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap">';
    h += '<span><strong>' + d.stats.total + '</strong> vervangingen</span>';
    Object.keys(d.stats.types || {}).forEach(function(t) {
      h += '<span class="badge badge-blue">' + t + ': ' + d.stats.types[t] + '</span>';
    });
    h += '</div>';
  }

  // Diff view
  h += '<div class="diff-container">';
  h += '<div class="diff-panel"><h4>Origineel</h4>' + highlightPII(esc(d.extracted_text), d.anonymization_map) + '</div>';
  h += '<div class="diff-panel"><h4>Geanonimiseerd</h4>' + esc(d.anonymized_text) + '</div>';
  h += '</div>';

  // PII items per document (uit database)
  var piiItems = d.pii_items || [];
  if (piiItems.length) {
    h += '<h3 style="font-size:14px;margin:20px 0 8px"><span class="mi" style="color:var(--purple)">fingerprint</span> Opgeslagen persoonsgegevens (' + piiItems.length + ' items)</h3>';
    h += '<div class="card" style="padding:0;overflow:hidden">';
    h += '<table class="map-table" style="margin:0"><thead><tr><th>Type</th><th>Origineel</th><th>Vervanging</th><th></th></tr></thead><tbody>';
    piiItems.forEach(function(p) {
      var typeColor = p.type === 'naam' ? 'var(--blue)' : p.type === 'email' ? 'var(--green)' : p.type === 'telefoon' ? 'var(--yellow)' : p.type === 'adres' ? 'var(--purple)' : p.type === 'postcode' ? 'var(--accent)' : 'var(--tx3)';
      h += '<tr>';
      h += '<td><span class="badge" style="background:' + typeColor + ';color:#fff;font-size:10px;padding:2px 8px">' + esc(p.type) + '</span></td>';
      h += '<td style="color:var(--red);font-family:monospace;font-size:12px">' + esc(p.origineel) + '</td>';
      h += '<td style="font-family:monospace;font-size:12px;color:var(--green)">' + esc(p.vervanging) + '</td>';
      h += '<td><button class="btn btn-ghost btn-sm" onclick="deletePII(\'' + esc(d.id) + '\',' + p.id + ')"><span class="mi">close</span></button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  // Mapping table
  var map = d.anonymization_map || {};
  var entries = Object.entries(map);
  if (entries.length) {
    h += '<h3 style="font-size:14px;margin:20px 0 8px">Mapping (' + entries.length + ' vervangingen)</h3>';
    h += '<table class="map-table"><thead><tr><th>Origineel</th><th>Vervanging</th><th></th></tr></thead><tbody>';
    entries.forEach(function(e, i) {
      h += '<tr><td style="color:var(--red);font-family:monospace;font-size:12px">' + esc(e[0]) + '</td>';
      h += '<td><input value="' + esc(e[1]) + '" data-orig="' + esc(e[0]) + '" class="map-input"></td>';
      h += '<td><button class="btn btn-ghost btn-sm" onclick="removeMapping(\'' + esc(d.id) + '\',\'' + esc(e[0]).replace(/'/g,"\\'") + '\')"><span class="mi">close</span></button></td></tr>';
    });
    h += '</tbody></table>';
    h += '<button class="btn btn-blue btn-sm" style="margin-top:12px" onclick="saveMapping(\'' + d.id + '\')"><span class="mi">save</span> Mapping opslaan</button>';
  }

  app.innerHTML = h;
}

function highlightPII(escapedText, map) {
  var result = escapedText;
  Object.keys(map || {}).forEach(function(orig) {
    var escaped = esc(orig);
    result = result.split(escaped).join('<span class="highlight-pii">' + escaped + '</span>');
  });
  return result;
}

function approveAnon(docId) {
  apiFetch('/documenten/' + docId + '/approve-anon', { method: 'POST' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast('Anonimisering goedgekeurd!');
    history.back();
  });
}

function deletePII(docId, piiId) {
  if (!confirm('PII-item verwijderen uit de database?')) return;
  apiFetch('/documenten/' + docId + '/pii/' + piiId, { method: 'DELETE' }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast('PII-item verwijderd');
    pgAnonReview(docId);
  });
}

function saveMapping(docId) {
  var map = {};
  document.querySelectorAll('.map-input').forEach(function(input) {
    map[input.dataset.orig] = input.value;
  });
  apiFetch('/documenten/' + docId + '/anonymized', { method: 'PUT', body: { anonymization_map: map } }, function(err, data, ok) {
    if (err || !ok) { toast('Fout: ' + (err || data.error)); return; }
    toast('Mapping opgeslagen');
    pgAnonReview(docId);
  });
}

// ---- ANALYSE TAB ----
function renderAnalyseTab(zaakId) {
  var tc = document.getElementById('tabContent');
  tc.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

  apiFetch('/zaken/' + zaakId + '/analyses', function(err, data) {
    if (err) { tc.innerHTML = '<p style="color:var(--red)">Fout bij laden</p>'; return; }

    var h = '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">';
    h += '<button class="btn btn-blue btn-sm" onclick="aiRefreshZaak(\'' + zaakId + '\')"><span class="mi">auto_awesome</span> Volledige AI Analyse</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="runAnalysis(\'' + zaakId + '\',\'procedure_advies\')"><span class="mi">gavel</span> Procedure-advies</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="runAnalysis(\'' + zaakId + '\',\'deadline_check\')"><span class="mi">schedule</span> Termijnen</button>';
    h += '<button class="btn btn-ghost btn-sm" onclick="runAnalysis(\'' + zaakId + '\',\'concept\')"><span class="mi">edit_document</span> Concept</button>';
    h += '</div>';

    if (!data || !data.length) {
      h += '<div class="empty-state"><span class="mi">psychology</span><p>Nog geen analyses. Klik op "Volledige AI Analyse" om Claude de zaak te laten analyseren.</p></div>';
      tc.innerHTML = h;
      return;
    }

    // Groepeer analyses per type met mooie kaarten
    var typeConfig = {
      wat_is_veranderd: { icon: 'change_circle', color: '#ef4444', label: 'Wat is er veranderd?' },
      samenvatting: { icon: 'article', color: 'var(--accent)', label: 'Samenvatting' },
      juridische_analyse: { icon: 'gavel', color: '#8b5cf6', label: 'Juridische Analyse' },
      advies: { icon: 'lightbulb', color: '#10b981', label: 'Advies & Vervolgstappen' },
      vergelijkbare_zaken: { icon: 'search', color: '#ec4899', label: 'Vergelijkbare Jurisprudentie' },
      personen: { icon: 'people', color: '#f97316', label: 'Personenregister met overtredingen' },
      tijdlijn: { icon: 'timeline', color: 'var(--accent)', label: 'Tijdlijn' },
      procedure_advies: { icon: 'gavel', color: '#8b5cf6', label: 'Procedure-advies' },
      deadline_check: { icon: 'schedule', color: '#eab308', label: 'Termijnen' },
      uitleg: { icon: 'help', color: 'var(--accent)', label: 'Uitleg' },
      concept: { icon: 'edit_document', color: 'var(--accent)', label: 'Concept' },
    };

    // Volgorde: samenvatting eerst, dan juridisch, advies, personen, etc.
    var order = ['wat_is_veranderd', 'samenvatting', 'juridische_analyse', 'advies', 'vergelijkbare_zaken', 'personen', 'tijdlijn', 'procedure_advies', 'deadline_check', 'uitleg', 'concept'];
    var sorted = data.sort(function(a, b) {
      var ia = order.indexOf(a.type); if (ia < 0) ia = 99;
      var ib = order.indexOf(b.type); if (ib < 0) ib = 99;
      return ia - ib;
    });

    sorted.forEach(function(a) {
      var cfg = typeConfig[a.type] || { icon: 'psychology', color: 'var(--tx3)', label: a.type };
      h += '<div class="card" style="margin-bottom:12px;border-left:3px solid ' + cfg.color + '">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      h += '<h3 style="font-size:14px;margin:0"><span class="mi" style="color:' + cfg.color + ';vertical-align:-3px">' + cfg.icon + '</span> ' + cfg.label + '</h3>';
      h += '<span style="font-size:10px;color:var(--tx3)">' + fmtDateTime(a.created_at);
      if (a.ai_provider) h += ' | ' + esc(a.ai_provider) + '/' + esc(a.ai_model);
      h += '</span></div>';

      // Probeer JSON mooi te renderen
      var tekst = a.result_text || '';
      try {
        var parsed = JSON.parse(tekst);
        if (Array.isArray(parsed)) {
          // Lijst (tijdlijn, personen, jurisprudentie)
          h += '<div style="font-size:13px;line-height:1.7">';
          parsed.forEach(function(item, i) {
            h += '<div style="padding:6px 0;border-bottom:1px solid var(--bd)">';
            if (item.datum) h += '<strong style="color:var(--accent)">' + esc(item.datum) + '</strong> ';
            if (item.event) h += esc(item.event);
            if (item.naam) h += '<strong>' + esc(item.naam) + '</strong>';
            if (item.organisatie) h += ' (' + esc(item.organisatie) + ')';
            if (item.overtredingen) h += '<div style="color:var(--red);font-size:12px;margin-top:2px">⚠ ' + esc(item.overtredingen) + '</div>';
            if (item.ecli) h += '<strong>' + esc(item.ecli) + '</strong> ';
            if (item.beschrijving) h += esc(item.beschrijving);
            if (item.relevantie) h += '<div style="font-size:11px;color:var(--tx3);margin-top:2px">Relevantie: ' + esc(item.relevantie) + '</div>';
            if (item.persoon) h += ' <span style="color:var(--tx3);font-size:11px">[' + esc(item.persoon) + ']</span>';
            h += '</div>';
          });
          h += '</div>';
        } else if (typeof parsed === 'object') {
          // Object (juridische analyse, advies)
          h += '<div style="font-size:13px;line-height:1.7">';
          for (var key in parsed) {
            var val = parsed[key];
            var keyLabel = key.replace(/_/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); });
            h += '<div style="margin-bottom:8px">';
            h += '<strong style="color:' + cfg.color + '">' + esc(keyLabel) + ':</strong> ';
            if (Array.isArray(val)) {
              h += '<ul style="margin:4px 0 0 16px;padding:0">';
              val.forEach(function(v) { h += '<li>' + esc(typeof v === 'string' ? v : JSON.stringify(v)) + '</li>'; });
              h += '</ul>';
            } else {
              h += esc(String(val));
            }
            h += '</div>';
          }
          h += '</div>';
        } else {
          h += '<div style="white-space:pre-wrap;font-size:13px;line-height:1.7">' + esc(tekst) + '</div>';
        }
      } catch(e) {
        // Niet-JSON: toon als tekst
        h += '<div style="white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:400px;overflow-y:auto">' + esc(tekst) + '</div>';
      }
      h += '</div>';
    });

    tc.innerHTML = h;
  });
}

function runAnalysis(zaakId, type) {
  // Check of samenvatting actueel is
  apiFetch('/zaken/' + zaakId, function(err, z) {
    if (err) { toast('Fout bij laden zaak'); return; }
    var hasAnon = (z.documenten || []).some(function(d) { return d.has_anonymized; });
    var hasSamenvatting = z.samenvatting || (z.omschrijving && z.omschrijving.length > 20);
    if (!hasSamenvatting && hasAnon) {
      if (confirm('Er is nog geen samenvatting voor deze zaak. Wilt u eerst een samenvatting genereren?')) {
        generateSamenvatting(zaakId);
        return;
      }
    } else if (z.samenvatting && z.doc_count !== z.samenvatting_doc_count) {
      if (confirm('De samenvatting is verouderd (er zijn nieuwe documenten toegevoegd). Wilt u de samenvatting eerst bijwerken?')) {
        generateSamenvatting(zaakId);
        return;
      }
    }
    // Ga door met analyse
    toast('Analyse starten (' + type + ')...');
    var el = document.getElementById('analyseResults');
    if (el) el.innerHTML = '<div class="loading"><div class="spinner"></div> Bezig met analyse... Dit kan even duren.</div>';
    apiFetch('/zaken/' + zaakId + '/analyze', { method: 'POST', body: { type: type, force: true } }, function(err2, data, ok) {
      if (err2 || !ok) { toast('Fout: ' + (err2 || data.error)); if(el) el.innerHTML = '<div style="color:var(--red)">' + esc(err2 || data.error) + '</div>'; return; }
      toast('Analyse voltooid!');
      renderAnalyseTab(zaakId);
    });
  });
}

// ---- TIJDLIJN TAB ----
var _timelineFilter = 'all'; // 'all', 'document', 'email'
var _timelineData = null;

function renderTimelineTab(zaakId) {
  var tc = document.getElementById('tabContent');
  tc.innerHTML = '<div class="loading"><div class="spinner"></div> <span style="color:var(--tx3);font-size:13px">Tijdlijn laden...</span></div>';
  _timelineFilter = 'all';

  // Haal eerst de zaak-analyses op voor de events tijdlijn
  apiFetch('/zaken/' + zaakId + '/analyses', function(err2, analyses) {
    var tijdlijnAnalyse = (analyses || []).find(function(a) { return a.type === 'tijdlijn'; });

    // Haal ook de document timeline op
    apiFetch('/zaken/' + zaakId + '/timeline', function(err, data, ok) {
      _timelineData = data || { items: [] };

      // Parse de events uit de tijdlijn analyse
      var events = [];
      if (tijdlijnAnalyse && tijdlijnAnalyse.result_text) {
        var lines = tijdlijnAnalyse.result_text.split('\n');
        lines.forEach(function(line) {
          line = line.trim();
          if (!line || line.startsWith('TIJDLIJN')) return;
          // Format: "2024-08-03   Event text [Persoon]"
          var match = line.match(/^(\d{4}-\d{2}(?:-\d{2})?)\s+(.+?)(?:\s+\[(.+?)\])?$/);
          if (match) {
            events.push({ date: match[1], event: match[2].trim(), persoon: match[3] || '' });
          }
        });
      }

      var h = '';

      // Header
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
      h += '<div style="font-size:15px;font-weight:600"><span class="mi" style="color:var(--accent);vertical-align:-3px">timeline</span> Zaakverloop</div>';
      h += '<div style="display:flex;gap:6px">';
      h += '<button class="tl-filter-btn' + (_timelineFilter==='all'?' active':'') + '" onclick="setTlFilter(\'all\',\'' + zaakId + '\')">Alles</button>';
      h += '<button class="tl-filter-btn' + (_timelineFilter==='event'?' active':'') + '" onclick="setTlFilter(\'event\',\'' + zaakId + '\')"><span class="mi" style="font-size:12px">event</span> Gebeurtenissen (' + events.length + ')</button>';
      h += '<button class="tl-filter-btn' + (_timelineFilter==='document'?' active':'') + '" onclick="setTlFilter(\'document\',\'' + zaakId + '\')"><span class="mi" style="font-size:12px">description</span> Documenten</button>';
      h += '</div></div>';

      // Events tijdlijn
      if (events.length && _timelineFilter !== 'document') {
        h += '<div class="tl-container"><div class="tl-line"></div>';
        var lastDate = '';
        events.forEach(function(ev) {
          if (ev.date !== lastDate) {
            lastDate = ev.date;
            h += '<div class="tl-date-header">' + ev.date + '</div>';
          }
          // Kleur op basis van event type
          var color = 'var(--accent)';
          var icon = 'event';
          var evLower = ev.event.toLowerCase();
          if (evLower.indexOf('klacht') >= 0 || evLower.indexOf('aangifte') >= 0) { color = 'var(--red)'; icon = 'warning'; }
          else if (evLower.indexOf('afwijzing') >= 0) { color = '#f97316'; icon = 'cancel'; }
          else if (evLower.indexOf('ingebrekestelling') >= 0 || evLower.indexOf('dwangsom') >= 0) { color = '#eab308'; icon = 'gavel'; }
          else if (evLower.indexOf('zitting') >= 0) { color = 'var(--purple)'; icon = 'balance'; }
          else if (evLower.indexOf('brief') >= 0 || evLower.indexOf('mail') >= 0 || evLower.indexOf('stuurt') >= 0) { color = 'var(--accent)'; icon = 'mail'; }
          else if (evLower.indexOf('avg') >= 0 || evLower.indexOf('inzage') >= 0) { color = '#10b981'; icon = 'privacy_tip'; }
          else if (evLower.indexOf('spoed') >= 0) { color = '#ef4444'; icon = 'priority_high'; }

          h += '<div class="tl-item">';
          h += '<div class="tl-dot" style="background:' + color + '"></div>';
          h += '<div class="tl-card" style="cursor:default;border-left:3px solid ' + color + '">';
          h += '<div class="tl-title"><span class="mi" style="font-size:16px;color:' + color + '">' + icon + '</span> ' + esc(ev.event) + '</div>';
          if (ev.persoon) {
            h += '<div class="tl-meta"><span><span class="mi">person</span> ' + esc(ev.persoon) + '</span></div>';
          }
          h += '</div></div>';
        });
        h += '</div>';
      }

      // Document tijdlijn (als filter document of all)
      if (_timelineFilter !== 'event' && _timelineData && _timelineData.items && _timelineData.items.length) {
        if (events.length && _timelineFilter === 'all') {
          h += '<div style="margin:20px 0 12px;font-size:14px;font-weight:600;color:var(--tx2)"><span class="mi" style="vertical-align:-3px">description</span> Documenten</div>';
        }
        drawTimeline(tc, _timelineData, zaakId);
        return; // drawTimeline zet tc.innerHTML
      }

      if (!events.length && (!_timelineData || !_timelineData.items || !_timelineData.items.length)) {
        h += '<div class="empty-state"><span class="mi">timeline</span><p>Geen tijdlijn beschikbaar. Laat Claude de documenten analyseren via de AI Advies tab.</p></div>';
      }

      tc.innerHTML = h;
    });
  });
}

function drawTimeline(tc, data, zaakId) {
  var items = data.items || [];

  // Filter toepassen
  var filtered = items;
  if (_timelineFilter !== 'all') {
    filtered = items.filter(function(it) { return it.type === _timelineFilter; });
  }

  var docCount = items.filter(function(it){ return it.type === 'document'; }).length;
  var emailCount = items.filter(function(it){ return it.type === 'email'; }).length;

  var h = '';

  // Filter bar
  h += '<div class="tl-filter">';
  h += '<button class="tl-filter-btn' + (_timelineFilter==='all'?' active':'') + '" onclick="setTlFilter(\'all\',\'' + zaakId + '\')"><span class="mi" style="font-size:14px">list</span> Alles (' + items.length + ')</button>';
  h += '<button class="tl-filter-btn' + (_timelineFilter==='document'?' active':'') + '" onclick="setTlFilter(\'document\',\'' + zaakId + '\')"><span class="mi" style="font-size:14px;color:var(--accent)">description</span> Documenten (' + docCount + ')</button>';
  h += '<button class="tl-filter-btn' + (_timelineFilter==='email'?' active':'') + '" onclick="setTlFilter(\'email\',\'' + zaakId + '\')"><span class="mi" style="font-size:14px;color:var(--purple)">email</span> E-mails (' + emailCount + ')</button>';

  if (!emailCount) {
    h += '<span style="font-size:11px;color:var(--tx3);margin-left:8px"><span class="mi mi-sm">info</span> Koppel Outlook via Instellingen om e-mails te doorzoeken</span>';
  }
  h += '</div>';

  if (!filtered.length) {
    h += '<div class="empty-state"><span class="mi">timeline</span>';
    if (_timelineFilter === 'email') {
      h += '<p>Geen e-mails gevonden voor deze zaak.<br><a href="#/instellingen" style="color:var(--accent)">Koppel Outlook</a> om e-mails te doorzoeken.</p>';
    } else {
      h += '<p>Geen items in de tijdlijn.</p>';
    }
    h += '</div>';
    tc.innerHTML = h;
    return;
  }

  // Groepeer per datum
  h += '<div class="tl-container"><div class="tl-line"></div>';
  var lastDate = '';
  filtered.forEach(function(it) {
    var dateStr = it.date || 'Onbekende datum';
    if (dateStr !== lastDate) {
      lastDate = dateStr;
      h += '<div class="tl-date-header">' + (dateStr === 'Onbekende datum' ? dateStr : fmtDate(dateStr)) + '</div>';
    }

    h += '<div class="tl-item">';
    h += '<div class="tl-dot ' + it.type + '"></div>';

    if (it.type === 'document') {
      h += '<div class="tl-card doc-card" onclick="go(\'/document/' + it.doc_id + '\')">';
      h += '<div class="tl-title"><span class="mi" style="font-size:16px;color:var(--accent)">description</span> ' + esc(it.title);
      if (it.doc_type) h += ' <span class="badge badge-blue" style="font-size:10px">' + esc(it.doc_type) + '</span>';
      if (it.richting) {
        var rIcon = {inkomend:'call_received', uitgaand:'call_made', intern:'swap_horiz'}[it.richting] || '';
        h += ' <span class="badge" style="font-size:10px;background:rgba(148,163,184,.1);color:var(--tx2)"><span class="mi" style="font-size:11px;vertical-align:-2px">' + rIcon + '</span> ' + esc(it.richting) + '</span>';
      }
      h += '</div>';
      if (it.subtitle) h += '<div class="tl-sub">' + esc(it.subtitle) + '</div>';
      h += '<div class="tl-meta">';
      if (it.afzender) h += '<span><span class="mi">person</span> ' + esc(it.afzender) + '</span>';
      if (it.ontvanger) h += '<span><span class="mi">arrow_forward</span> ' + esc(it.ontvanger) + '</span>';
      if (it.kenmerk) h += '<span><span class="mi">tag</span> ' + esc(it.kenmerk) + '</span>';
      if (it.has_text) h += '<span style="color:var(--green)"><span class="mi">check_circle</span> tekst</span>';
      h += '</div>';
      h += '</div>';
    } else if (it.type === 'email') {
      h += '<div class="tl-card email-card" onclick="showEmailDetail(\'' + esc(it.email_id) + '\')">';
      h += '<div class="tl-title"><span class="mi" style="font-size:16px;color:var(--purple)">email</span> ' + esc(it.title);
      if (it.importance === 'high') h += ' <span class="badge badge-red" style="font-size:10px">belangrijk</span>';
      if (it.has_attachments) h += ' <span class="mi" style="font-size:14px;color:var(--tx3)" title="Heeft bijlagen">attach_file</span>';
      h += '</div>';
      if (it.subtitle) h += '<div class="tl-sub">' + esc(it.subtitle) + '</div>';
      h += '<div class="tl-meta">';
      if (it.from_name || it.from_email) h += '<span><span class="mi">person</span> ' + esc(it.from_name || it.from_email) + '</span>';

function showEmailDetail(messageId) {
  // Open email detail modal
  var modal = document.createElement('div');

  modal.id = 'emailModal';
  modal.onclick = function(e) { if (e.target === modal) modal.remove(); };

    '<div class="email-modal-header"><span class="mi" style="color:var(--purple)">email</span> <h3>E-mail laden...</h3>' +
    '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'emailModal\').remove()"><span class="mi">close</span></button></div>' +
    '<div class="email-modal-body"><div class="loading"><div class="spinner"></div></div></div></div>';
  document.body.appendChild(modal);

  apiFetch('/outlook/email/' + messageId, function(err, email, ok) {
    var box = modal.querySelector('.email-modal-box');
    if (!box) return;
    if (err || !ok) {
      box.innerHTML = '<div class="email-modal-header"><span class="mi" style="color:var(--red)">error</span> <h3>Fout</h3>' +
        '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'emailModal\').remove()"><span class="mi">close</span></button></div>' +
        '<div class="email-modal-body" style="color:var(--red)">' + esc(err || (email && email.error) || 'Onbekend') + '</div>';
      return;
    }

    var h = '<div class="email-modal-header"><span class="mi" style="color:var(--purple)">email</span> <h3>' + esc(email.subject) + '</h3>';
    h += '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'emailModal\').remove()"><span class="mi">close</span></button></div>';

    h += '<div class="email-modal-meta">';
    h += '<div><strong>Van:</strong> ' + esc(email.from_name || '') + ' &lt;' + esc(email.from_email || '') + '&gt;</div>';
    if (email.to && email.to.length) h += '<div><strong>Aan:</strong> ' + esc(email.to.join(', ')) + '</div>';
    if (email.cc && email.cc.length) h += '<div><strong>CC:</strong> ' + esc(email.cc.join(', ')) + '</div>';
    h += '<div><strong>Datum:</strong> ' + fmtDateTime(email.received || email.sent) + '</div>';
    if (email.has_attachments) h += '<div><span class="mi mi-sm" style="color:var(--yellow)">attach_file</span> <strong>Bijlagen</strong></div>';
    h += '</div>';

    h += '<div class="email-modal-body">';
    if (email.body_type === 'html') {
      // Render HTML email in sandboxed iframe
      h += '<iframe id="emailFrame" sandbox="allow-same-origin" style="width:100%;min-height:400px;border:none;background:#fff;border-radius:var(--rs)"></iframe>';
    } else {
      h += '<pre style="white-space:pre-wrap;font-family:var(--font);font-size:13px;line-height:1.7">' + esc(email.body || email.preview || '') + '</pre>';
    }
    h += '</div>';

    box.innerHTML = h;

    // Als HTML body, schrijf naar iframe
    if (email.body_type === 'html' && email.body) {
      var frame = document.getElementById('emailFrame');
      if (frame) {
        setTimeout(function() {
          var doc = frame.contentDocument || frame.contentWindow.document;
          doc.open();
          doc.write('<html><head><style>body{font-family:sans-serif;font-size:14px;color:#333;padding:16px;margin:0;}</style></head><body>' + email.body + '</body></html>');
          doc.close();
          // Auto-resize iframe
          setTimeout(function() {
            try { frame.style.height = (doc.body.scrollHeight + 40) + 'px'; } catch(e){}
          }, 200);
        }, 50);
      }
    }
  });
}

function chatBubble(role, content) {
  var isUser = role === 'user';
  var bg = isUser ? 'var(--accent)' : 'var(--bg2)';
  var color = isUser ? '#fff' : 'var(--tx)';
  var align = isUser ? 'flex-end' : 'flex-start';
  var icon = isUser ? 'person' : 'smart_toy';
  var maxW = isUser ? '70%' : '90%';
  return '<div style="display:flex;justify-content:' + align + '">' +
    '<div style="max-width:' + maxW + ';padding:10px 14px;border-radius:12px;background:' + bg + ';color:' + color + ';font-size:13px;line-height:1.6;white-space:pre-wrap">' +
    '<div style="font-size:10px;opacity:0.6;margin-bottom:4px"><span class="mi" style="font-size:12px;vertical-align:-2px">' + icon + '</span> ' + (isUser ? 'Jij' : 'AI Assistent') + '</div>' +
    content + '</div></div>';
}

function clearChat(zaakId) {
  _chatHistory[zaakId] = [];
  renderChatTab(zaakId);
}

function sendChat(zaakId) {
  var input = document.getElementById('chatInput');
  if (!input || !input.value.trim()) return;
  var vraag = input.value.trim();
  input.value = '';

  // Voeg user bericht toe
  if (!_chatHistory[zaakId]) _chatHistory[zaakId] = [];
  _chatHistory[zaakId].push({ role: 'user', content: vraag });

  // Toon direct
  var msgs = document.getElementById('chatMessages');
  if (msgs) {
    msgs.innerHTML = _chatHistory[zaakId].map(function(m){ return chatBubble(m.role, m.content); }).join('');
    msgs.innerHTML += chatBubble('assistant', '<span class="mi" style="animation:spin 1s linear infinite;font-size:14px">hourglass_top</span> Denken...');
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Disable input
  var btn = document.getElementById('chatSendBtn');
  if (btn) btn.disabled = true;
  if (input) input.disabled = true;

  // Stuur naar API
  apiFetch('/zaken/' + zaakId + '/chat', {
    method: 'POST',
    body: { vraag: vraag, history: _chatHistory[zaakId].slice(-10) }
  }, function(err, data, ok) {
    if (btn) btn.disabled = false;
    if (input) { input.disabled = false; input.focus(); }

    if (err || !ok) {
      _chatHistory[zaakId].push({ role: 'assistant', content: 'Fout: ' + (err || (data && data.error) || 'Onbekende fout. Controleer of Ollama draait (http://localhost:11434).') });
    } else {
      _chatHistory[zaakId].push({ role: 'assistant', content: data.antwoord || data.response || 'Geen antwoord ontvangen.' });
    }

    if (msgs) {
      msgs.innerHTML = _chatHistory[zaakId].map(function(m){ return chatBubble(m.role, m.content); }).join('');
      msgs.scrollTop = msgs.scrollHeight;
    }
  });
}

function renderMeldpuntTab(zaakId) {

    if (personenAnalyse && personenAnalyse.result_text) {
      try { personen = JSON.parse(personenAnalyse.result_text); } catch(e) {}
    }

    // Filter alleen personen met overtredingen
    var overtreders = personen.filter(function(p) { return p.overtredingen && p.overtredingen !== 'null' && p.overtredingen.length > 5; });

    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';

    h += '<span style="font-size:12px;color:var(--tx3)">' + overtreders.length + ' personen met overtredingen</span>';
    h += '</div>';

    if (!overtreders.length) {
      h += '<div class="card" style="text-align:center;padding:24px;color:var(--tx3)">';
      h += '<span class="mi" style="font-size:36px;display:block;margin-bottom:8px;opacity:0.3">people</span>';

      // Per persoon een kaart met melding-knop
      overtreders.forEach(function(p, i) {
        h += '<div class="card" style="margin-bottom:12px;border-left:3px solid var(--red)">';
        h += '<div style="display:flex;justify-content:space-between;align-items:start">';
        h += '<div style="flex:1">';
        h += '<div style="font-size:15px;font-weight:700;color:var(--tx)">' + esc(p.naam) + '</div>';
        h += '<div style="font-size:12px;color:var(--tx3);margin-top:2px">';
        if (p.organisatie) h += esc(p.organisatie);
        if (p.functie) h += ' — ' + esc(p.functie);
        h += '</div>';
        if (p.email) h += '<div style="font-size:11px;color:var(--accent);margin-top:2px">' + esc(p.email) + '</div>';
        h += '</div>';
        h += '<button class="btn btn-red btn-sm" onclick="startMelding(\'' + zaakId + '\',' + i + ')"><span class="mi">flag</span> Melding maken</button>';
        h += '</div>';

        // Overtredingen
        h += '<div style="margin-top:10px;padding:8px 12px;background:rgba(239,68,68,.06);border-radius:8px">';
        h += '<div style="font-size:11px;font-weight:600;color:var(--red);margin-bottom:4px">Overtredingen:</div>';
        h += '<div style="font-size:12px;color:var(--tx2);line-height:1.6;white-space:pre-wrap">' + esc(p.overtredingen) + '</div>';
        h += '</div>';
        h += '</div>';
      });
    }

    // Overige betrokkenen (zonder overtredingen)
    var overigen = personen.filter(function(p) { return !p.overtredingen || p.overtredingen === 'null' || p.overtredingen.length <= 5; });
    if (overigen.length) {
      h += '<div style="margin-top:16px">';
      h += '<h4 style="font-size:13px;color:var(--tx3);margin-bottom:8px"><span class="mi mi-sm">people</span> Overige betrokkenen (' + overigen.length + ')</h4>';
      overigen.forEach(function(p) {
        h += '<div style="padding:6px 12px;margin-bottom:4px;font-size:12px;color:var(--tx2);display:flex;gap:8px;align-items:center">';

        h += '</div>';
      });
      h += '</div>';
    }

    // Melding formulier (hidden, verschijnt bij klik)
    h += '<div id="meldingForm" style="display:none;margin-top:16px"></div>';

    tc.innerHTML = h;

    // Sla personen op voor gebruik in startMelding
    window._meldpuntPersonen = overtreders;
  });

        method: 'POST',
        body: {
          vraag: 'Geef een compleet advies over dit document. Gebruik exact dit format:\n\n## Advies\nAANBEVOLEN ACTIE: [welk type reactie: reactie/bezwaar/beroep/ingebrekestelling/klacht/geen actie nodig]\nWAAR STUREN: [volledige naam, adres en/of email van de ontvanger]\nHOE VERSTUREN: [aangetekend per post / email / digitaal loket rechtspraak]\nTERMIJN: [binnen hoeveel dagen, welke wettelijke termijn]\nKANS VAN SLAGEN: [hoog/middel/laag met korte uitleg]\nWAT HET OPLEVERT: [concreet in euros of resultaat]\nWIE BETAALT DE DWANGSOM: [organisatie + op basis van welk wetsartikel]\nALS ZE NIET REAGEREN: [concrete vervolgstappen om af te dwingen]\n\n## Concept reactie\n[Schrijf hier direct een volledige concept-brief/reactie op dit document. Begin met datum en geadresseerde. Verwijs naar relevante wetsartikelen. Eindig met Hoogachtend, A. Spijker]',
          history: []
        }
      }, function(err, result) {
        var el = document.getElementById('docAutoAdviesContent');
        if (!el) return;
        if (err || !result || !result.antwoord) {
          el.innerHTML = '<span style="color:var(--tx3)">AI advies kon niet geladen worden. Gebruik de chat rechts om vragen te stellen.</span>';
          return;
        }
        // Render met formatting
        var tekst = result.antwoord;
        var html = tekst
          .replace(/</g, '&lt;')
          .replace(/## (.*)/g, '<div style="font-size:14px;font-weight:700;color:#10b981;margin:12px 0 6px;border-bottom:1px solid rgba(16,185,129,.2);padding-bottom:4px">$1</div>')
          .replace(/AANBEVOLEN ACTIE:/g, '<strong style="color:#10b981">AANBEVOLEN ACTIE:</strong>')
          .replace(/WAAR STUREN:/g, '<strong style="color:var(--accent)">WAAR STUREN:</strong>')
          .replace(/HOE VERSTUREN:/g, '<strong style="color:var(--accent)">HOE VERSTUREN:</strong>')
          .replace(/TERMIJN:/g, '<strong style="color:#eab308">TERMIJN:</strong>')
          .replace(/KANS VAN SLAGEN:/g, '<strong style="color:#8b5cf6">KANS VAN SLAGEN:</strong>')
          .replace(/WAT HET OPLEVERT:/g, '<strong style="color:#10b981">WAT HET OPLEVERT:</strong>')
          .replace(/WIE BETAALT DE DWANGSOM:/g, '<strong style="color:#f97316">WIE BETAALT:</strong>')
          .replace(/ALS ZE NIET REAGEREN:/g, '<strong style="color:#ef4444">ALS ZE NIET REAGEREN:</strong>')
          .replace(/\n/g, '<br>');
        el.innerHTML = '<div style="line-height:1.7">' + html + '</div>';
        el.innerHTML += '<div style="margin-top:12px;display:flex;gap:6px">';
        el.innerHTML += '<button class="btn btn-blue btn-sm" onclick="copyAutoAdvies()"><span class="mi">content_copy</span> Kopieer brief</button>';
        el.innerHTML += '<button class="btn btn-ghost btn-sm" onclick="openReactieEditor(\'' + _autoDocId + '\')"><span class="mi">edit</span> Bewerk in editor</button>';
        el.innerHTML += '</div>';
      });
    }, 200);

    // Metadata
    var meta = data.metadata || {};
    var metaParts = [];
    if (data.doc_type) metaParts.push('<strong>Type:</strong> ' + esc(data.doc_type));
    if (data.doc_datum) metaParts.push('<strong>Datum:</strong> ' + esc(data.doc_datum));
    if (data.doc_afzender) metaParts.push('<strong>Van:</strong> ' + esc(data.doc_afzender));
    if (data.doc_ontvanger) metaParts.push('<strong>Aan:</strong> ' + esc(data.doc_ontvanger));
    if (meta.kenmerk && meta.kenmerk.length) metaParts.push('<strong>Kenmerk:</strong> ' + meta.kenmerk.map(esc).join(', '));
    if (meta.bsn_detected) metaParts.push('<span style="color:var(--red)"><span class="mi mi-sm">warning</span> BSN gedetecteerd</span>');
    if (metaParts.length) {
      h += '<div class="card" style="margin-bottom:12px;padding:10px 16px;font-size:12px;display:flex;flex-wrap:wrap;gap:12px">';
      h += metaParts.join(' &nbsp;|&nbsp; ');
      h += '</div>';
    }

    // Split layout: PDF links, Chat rechts
    h += '<div style="display:flex;gap:12px;height:calc(100vh - ' + (data.samenvatting ? '380' : '300') + 'px);min-height:400px">';

    // PDF Preview (links)
    h += '<div style="flex:1;display:flex;flex-direction:column;min-width:0">';
    h += '<div style="display:flex;gap:6px;margin-bottom:8px">';
    h += '<button class="btn btn-sm ' + (!data.extracted_text ? 'btn-blue' : 'btn-ghost') + '" onclick="docTabSwitch(\'pdf\',\'' + docId + '\')"><span class="mi">picture_as_pdf</span> PDF</button>';
    h += '<button class="btn btn-sm ' + (data.extracted_text ? 'btn-blue' : 'btn-ghost') + '" onclick="docTabSwitch(\'tekst\',\'' + docId + '\')"><span class="mi">text_snippet</span> Tekst</button>';
    if (!data.extracted_text) {
      h += '<button class="btn btn-blue btn-sm" onclick="extractDoc(\'' + docId + '\',\'\');setTimeout(function(){pgDocument(\'' + docId + '\')},3000)"><span class="mi">text_snippet</span> Extraheer tekst</button>';
    }
    h += '</div>';

    // PDF iframe
    h += '<div id="docViewPdf" style="flex:1;border-radius:var(--rs);overflow:hidden;border:1px solid var(--bd)">';
    if (data.bestandspad && (data.bestandstype === 'pdf' || data.bestandsnaam.endsWith('.pdf'))) {
      h += '<iframe src="/api/documenten/' + docId + '/file" style="width:100%;height:100%;border:none"></iframe>';
    } else if (data.bestandsnaam.match(/\.(png|jpg|jpeg|gif|bmp|tiff?)$/i)) {
      h += '<img src="/api/documenten/' + docId + '/file" style="max-width:100%;max-height:100%;object-fit:contain">';
    } else {
      // Voor docx/txt: toon geextraheerde tekst als preview
      if (data.extracted_text) {
        h += '<div style="padding:16px;overflow-y:auto;height:100%;font-size:13px;line-height:1.7;color:var(--tx2);white-space:pre-wrap">' + esc(data.extracted_text) + '</div>';
      } else {
        h += '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--tx3)"><div style="text-align:center"><span class="mi" style="font-size:48px;display:block;margin-bottom:8px">description</span>Klik op "Extraheer tekst" om de inhoud te laden</div></div>';
      }
    }
    h += '</div>';

    // Tekst view (hidden initially)
    h += '<div id="docViewTekst" style="flex:1;display:none;overflow-y:auto;border:1px solid var(--bd);border-radius:var(--rs);padding:12px">';
    if (data.extracted_text) {
      h += '<pre style="white-space:pre-wrap;font-size:12px;line-height:1.7;color:var(--tx2);margin:0">' + esc(data.extracted_text) + '</pre>';
    } else {
      h += '<p style="color:var(--tx3);text-align:center;padding:40px">Tekst nog niet geextraheerd. Klik op "Extraheer tekst".</p>';
    }
    h += '</div>';
    h += '</div>'; // einde links

    // AI Chat (rechts)
    h += '<div style="width:380px;flex-shrink:0;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden">';
    h += '<div style="padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px">';
    h += '<span class="mi" style="color:var(--accent)">smart_toy</span>';
    h += '<strong style="font-size:13px">Vraag over dit document</strong>';
    h += '</div>';

    // Chat messages
    h += '<div id="docChatMsgs" style="flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px">';
    if (!_docChatHistory[docId] || !_docChatHistory[docId].length) {
      h += '<div style="padding:20px;text-align:center;color:var(--tx3);font-size:12px">';
      h += '<span class="mi" style="font-size:32px;display:block;margin-bottom:8px;opacity:0.3">chat</span>';
      h += 'Stel een vraag over dit document';
      h += '<div style="margin-top:12px;display:flex;flex-direction:column;gap:4px">';
      h += '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="docChatQuick(\'' + docId + '\',\'Vat dit document samen in 3 punten\')">Samenvatting</button>';
      h += '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="docChatQuick(\'' + docId + '\',\'Welke juridische argumenten staan in dit document?\')">Juridische argumenten</button>';
      h += '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="docChatQuick(\'' + docId + '\',\'Welke namen en organisaties worden genoemd?\')">Namen & organisaties</button>';
      h += '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="docChatQuick(\'' + docId + '\',\'Welke termijnen of deadlines worden genoemd?\')">Termijnen</button>';
      h += '<button class="btn btn-blue btn-sm" style="font-size:11px" onclick="openReactieEditor(\'' + docId + '\')"><span class="mi" style="font-size:12px">edit_document</span> Schrijf reactie</button>';
      h += '</div></div>';
    } else {
      _docChatHistory[docId].forEach(function(msg) {
        h += docChatBubble(msg.role, msg.content);
      });
    }
    h += '</div>';

    // Input
    h += '<div style="padding:8px;border-top:1px solid var(--bd);display:flex;gap:6px">';
    h += '<input id="docChatInput" class="form-input" style="flex:1;padding:8px 10px;font-size:12px" placeholder="Vraag..." onkeydown="if(event.key===\'Enter\')sendDocChat(\'' + docId + '\')">';
    h += '<button class="btn btn-blue btn-sm" onclick="sendDocChat(\'' + docId + '\')"><span class="mi">send</span></button>';
    h += '</div>';
    h += '</div>'; // einde chat

    h += '</div>'; // einde split layout

    app.innerHTML = h;
  });
}

function docTabSwitch(tab, docId) {
  var pdf = document.getElementById('docViewPdf');
  var tekst = document.getElementById('docViewTekst');
  if (tab === 'pdf') { if(pdf) pdf.style.display=''; if(tekst) tekst.style.display='none'; }
  else { if(pdf) pdf.style.display='none'; if(tekst) tekst.style.display=''; }
}

function docChatBubble(role, content) {
  var isUser = role === 'user';
  var bg = isUser ? 'var(--accent)' : 'var(--bg2)';
  var color = isUser ? '#fff' : 'var(--tx)';
  return '<div style="align-self:' + (isUser ? 'flex-end' : 'flex-start') + ';max-width:95%;padding:8px 12px;border-radius:10px;background:' + bg + ';color:' + color + ';font-size:12px;line-height:1.5;white-space:pre-wrap">' + content + '</div>';
}

function docChatQuick(docId, vraag) {
  var input = document.getElementById('docChatInput');
  if (input) input.value = vraag;
  sendDocChat(docId);
}

function copyAutoAdvies() {
  var el = document.getElementById('docAutoAdviesContent');
  if (el) {
    navigator.clipboard.writeText(el.innerText);
    toast('Brief gekopieerd naar klembord');
  }
}

function openReactieEditor(docId) {
  // Vervang de chat panel door een reactie editor
  var chatPanel = document.getElementById('docChatMsgs');
  var chatContainer = chatPanel ? chatPanel.parentElement : null;
  if (!chatContainer) return;

  var h = '<div style="padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px">';
  h += '<span class="mi" style="color:var(--green)">edit_document</span>';
  h += '<strong style="font-size:13px">Reactie schrijven</strong>';
  h += '<span style="flex:1"></span>';
  h += '<button class="btn btn-ghost btn-sm" onclick="pgDocument(\'' + docId + '\')"><span class="mi">close</span></button>';
  h += '</div>';

  // AI advies: welke procedure
  h += '<div id="reactieAdvies" style="padding:10px 14px;border-bottom:1px solid var(--bd);font-size:12px">';
  h += '<div style="color:var(--tx3)"><span class="mi" style="font-size:14px;animation:spin 1s linear infinite;vertical-align:-3px">hourglass_top</span> Claude analyseert welke reactie het beste past...</div>';
  h += '</div>';

  // Type selectie
  h += '<div style="padding:8px 14px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--bd)">';
  var types = [
    {id:'reactie', label:'Reactie', icon:'reply'},
    {id:'bezwaar', label:'Bezwaarschrift', icon:'edit_document'},
    {id:'beroep', label:'Beroepschrift', icon:'gavel'},
    {id:'ingebrekestelling', label:'Ingebrekestelling', icon:'warning'},
    {id:'klacht', label:'Klacht', icon:'flag'},
    {id:'brief', label:'Vrije brief', icon:'mail'},
  ];
  types.forEach(function(t) {
    h += '<button class="btn btn-ghost btn-sm" style="font-size:10px" id="reactieBtn_' + t.id + '" onclick="generateReactie(\'' + docId + '\',\'' + t.id + '\')"><span class="mi" style="font-size:12px">' + t.icon + '</span> ' + t.label + '</button>';
  });
  h += '</div>';

  // Editor
  h += '<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">';
  h += '<div id="reactieStatus" style="padding:6px 14px;font-size:11px;color:var(--tx3)">Kies een type hierboven of wacht op AI advies</div>';

  // Vraag Claude welke procedure het beste past
  setTimeout(function() {
    apiFetch('/documenten/' + docId + '/chat', {
      method: 'POST',
      body: {
        vraag: 'Analyseer dit document en adviseer welk type reactie het beste is. Geef CONCREET en PRAKTISCH advies. Gebruik dit format:\n\nAANBEVOLEN: [type: reactie/bezwaar/beroep/ingebrekestelling/klacht]\nWAAROM: [waarom dit type het beste past voor dit specifieke document]\nSTUUR NAAR: [volledige naam + adres/email van de ontvanger, gebaseerd op het document]\nHOE VERSTUREN: [per post aangetekend / per email / via loket.rechtspraak.nl / per Zivver]\nTERMIJN: [binnen hoeveel dagen moet dit verstuurd worden + welke wettelijke termijn geldt]\nKANS: [hoog/middel/laag met toelichting]\nOPLEVERT: [wat het concreet oplevert in euros of resultaat]\nWIE BETAALT: [wie moet de dwangsom/schadevergoeding betalen en op basis van welk wetsartikel]\nAFDWINGEN: [hoe dwing je het af als ze niet reageren - concrete vervolgstappen]\nLET OP: [valkuilen of aandachtspunten]',
        history: []
      }
    }, function(err, data) {
      var el = document.getElementById('reactieAdvies');
      if (!el) return;
      if (err || !data || !data.antwoord) {
        el.innerHTML = '<div style="color:var(--tx3)">AI advies niet beschikbaar. Kies zelf een type.</div>';
        return;
      }
      var antwoord = data.antwoord;

      // Parse het advies
      var aanbevolenMatch = antwoord.match(/AANBEVOLEN:\s*\[?(?:type:\s*)?([\w]+)\]?/i);
      var aanbevolen = aanbevolenMatch ? aanbevolenMatch[1].toLowerCase() : '';

      // Highlight de aanbevolen knop
      if (aanbevolen) {
        var btn = document.getElementById('reactieBtn_' + aanbevolen);
        if (btn) {
          btn.style.background = 'var(--accent)';
          btn.style.color = '#fff';
          btn.style.fontWeight = '700';
        }
      }

      // Toon advies
      var h2 = '<div style="background:rgba(16,185,129,.08);border-radius:8px;padding:8px 12px;border-left:3px solid #10b981">';
      h2 += '<div style="font-size:11px;font-weight:700;color:#10b981;margin-bottom:4px"><span class="mi" style="font-size:14px;vertical-align:-3px">lightbulb</span> AI Advies</div>';
      h2 += '<div style="font-size:12px;color:var(--tx);line-height:1.6;white-space:pre-wrap">' + antwoord.replace(/</g,'&lt;') + '</div>';
      h2 += '</div>';
      el.innerHTML = h2;
    });
  }, 100);
  h += '<textarea id="reactieEditor" style="flex:1;padding:12px 14px;background:var(--bg);color:var(--tx);border:none;resize:none;font-size:13px;line-height:1.7;font-family:inherit" placeholder="Begin hier met typen of laat Claude een concept genereren..."></textarea>';
  h += '</div>';

  // Acties onderaan
  h += '<div style="padding:8px 14px;border-top:1px solid var(--bd);display:flex;gap:6px;flex-wrap:wrap">';
  h += '<button class="btn btn-blue btn-sm" onclick="saveReactie(\'' + docId + '\')"><span class="mi">save</span> Opslaan als document</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="copyReactie()"><span class="mi">content_copy</span> Kopieer</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="improveReactie(\'' + docId + '\')"><span class="mi">auto_awesome</span> Verbeter met AI</button>';
  h += '</div>';

  chatContainer.innerHTML = h;
}

function generateReactie(docId, type) {
  var editor = document.getElementById('reactieEditor');
  var status = document.getElementById('reactieStatus');
  if (!editor || !status) return;

  var typeLabels = {reactie:'reactie', bezwaar:'bezwaarschrift', beroep:'beroepschrift', ingebrekestelling:'ingebrekestelling', klacht:'klacht', brief:'brief'};
  status.innerHTML = '<span class="mi" style="font-size:12px;animation:spin 1s linear infinite">hourglass_top</span> Claude schrijft ' + (typeLabels[type] || type) + '...';
  editor.disabled = true;

  var prompt = 'Schrijf een ' + (typeLabels[type] || type) + ' als reactie op dit document. ';
  prompt += 'Schrijf in het Nederlands, professioneel juridisch. ';
  prompt += 'Verwijs naar relevante wetsartikelen. ';
  prompt += 'Begin met: Arnhem, [datum van vandaag]. Dan de VOLLEDIGE naam en adres van de geadresseerde (haal dit uit het document of de zaak context). ';
  prompt += 'Vermeld altijd: Betreft: [zaaknummer], Indiener: A. Spijker. ';
  prompt += 'Eindig met: Hoogachtend, A. Spijker, a.spijker@live.nl. ';
  prompt += 'Voeg na de brief toe: --- VERSTUURINSTRUCTIES --- met: naar wie, hoe versturen (post/email/digitaal loket), en wat te doen als er geen reactie komt. ';
  if (type === 'bezwaar') prompt += 'Structuur: gronden van bezwaar, feiten, juridisch kader, verzoek. Vermeld bezwaartermijn (6 weken). ';
  if (type === 'beroep') prompt += 'Structuur: feiten, juridisch kader, gronden, verzoek aan rechtbank incl. dwangsom en proceskosten. ';
  if (type === 'ingebrekestelling') prompt += 'Vermeld exact welke wettelijke termijn overschreden is, verwijs naar art. 4:17 Awb. Vermeld dat de dwangsom na 2 weken automatisch verschuldigd is (EUR 23/dag eerste 14 dagen, EUR 35/dag volgende 14 dagen, EUR 45/dag daarna, max EUR 1.442). Vermeld dat je bij niet-betaling naar de rechter stapt voor een betalingsbevel. ';
  if (type === 'klacht') prompt += 'Beschrijf het gedrag dat klachtwaardig is, verwijs naar Awb hoofdstuk 9. Vermeld dat je bij onbevredigende klachtafhandeling naar de Nationale Ombudsman gaat. ';

  docChatQuick(docId, prompt);

  // Wacht op antwoord en vul editor
  var checkInterval = setInterval(function() {
    var history = _docChatHistory[docId] || [];
    var last = history[history.length - 1];
    if (last && last.role === 'assistant' && last.content && !last.content.includes('Denken...')) {
      clearInterval(checkInterval);
      editor.value = last.content;
      editor.disabled = false;
      status.innerHTML = '<span class="mi" style="font-size:12px;color:var(--green)">check_circle</span> ' + (typeLabels[type] || type) + ' gegenereerd — bewerk naar wens';
    }
  }, 1000);

  // Timeout na 2 minuten
  setTimeout(function() { clearInterval(checkInterval); editor.disabled = false; }, 120000);
}

function improveReactie(docId) {
  var editor = document.getElementById('reactieEditor');
  var status = document.getElementById('reactieStatus');
  if (!editor || !editor.value.trim()) { toast('Schrijf eerst een tekst'); return; }

  status.innerHTML = '<span class="mi" style="font-size:12px;animation:spin 1s linear infinite">hourglass_top</span> Claude verbetert de tekst...';

  docChatQuick(docId, 'Verbeter deze tekst juridisch. Maak het scherper, voeg relevante wetsartikelen toe, en zorg dat het professioneel en overtuigend is. Behoud de structuur. Hier is de tekst:\n\n' + editor.value);

  var checkInterval = setInterval(function() {
    var history = _docChatHistory[docId] || [];
    var last = history[history.length - 1];
    if (last && last.role === 'assistant' && last.content && !last.content.includes('Denken...')) {
      clearInterval(checkInterval);
      editor.value = last.content;
      status.innerHTML = '<span class="mi" style="font-size:12px;color:var(--green)">check_circle</span> Tekst verbeterd';
    }
  }, 1000);
  setTimeout(function() { clearInterval(checkInterval); }, 120000);
}

function copyReactie() {
  var editor = document.getElementById('reactieEditor');
  if (editor) {
    navigator.clipboard.writeText(editor.value);
    toast('Tekst gekopieerd naar klembord');
  }
}

function saveReactie(docId) {
  var editor = document.getElementById('reactieEditor');
  if (!editor || !editor.value.trim()) { toast('Schrijf eerst een tekst'); return; }

  // Haal zaak_id op van dit document
  apiFetch('/documenten/' + docId + '/text', function(err, data) {
    if (err) { toast('Fout'); return; }
    var zaakId = data.zaak_id;
    var filename = 'reactie_' + new Date().toISOString().substring(0,10).replace(/-/g,'') + '.txt';

    apiFetch('/zaken/' + zaakId + '/save-reactie', {
      method: 'POST',
      body: { tekst: editor.value, filename: filename, bron_doc_id: docId }
    }, function(err2, result, ok) {
      if (err2 || !ok) { toast('Fout bij opslaan: ' + (err2 || result.error)); return; }
      toast('Reactie opgeslagen als ' + filename);
    });
  });
}

function sendDocChat(docId) {
  var input = document.getElementById('docChatInput');
  if (!input || !input.value.trim()) return;
  var vraag = input.value.trim();
  input.value = '';

  if (!_docChatHistory[docId]) _docChatHistory[docId] = [];
  _docChatHistory[docId].push({ role: 'user', content: vraag });

  var msgs = document.getElementById('docChatMsgs');
  if (msgs) {
    msgs.innerHTML = _docChatHistory[docId].map(function(m){ return docChatBubble(m.role, m.content); }).join('');
    msgs.innerHTML += docChatBubble('assistant', '<span class="mi" style="animation:spin 1s linear infinite;font-size:12px">hourglass_top</span> Denken...');
    msgs.scrollTop = msgs.scrollHeight;
  }

  apiFetch('/documenten/' + docId + '/chat', {
    method: 'POST',
    body: { vraag: vraag, history: _docChatHistory[docId].slice(-8) }
  }, function(err, data, ok) {
    if (err || !ok) {
      _docChatHistory[docId].push({ role: 'assistant', content: 'Fout: ' + (err || (data && data.error) || 'AI niet beschikbaar') });
    } else {
      _docChatHistory[docId].push({ role: 'assistant', content: data.antwoord || 'Geen antwoord.' });
    }
    if (msgs) {
      msgs.innerHTML = _docChatHistory[docId].map(function(m){ return docChatBubble(m.role, m.content); }).join('');
      msgs.scrollTop = msgs.scrollHeight;
    }
  });
}

// ---- ANALYSE PAGE (standalone) ----
function pgAnalyse(zaakId) {
  var app = document.getElementById('app');
  app.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  apiFetch('/zaken/' + zaakId + '/analyses', function(err, data) {
    if (err) { app.innerHTML = '<p>Fout bij laden</p>'; return; }
    var h = '<div class="section-title"><span class="mi">psychology</span> Analyses</div>';
    if (!data.length) {
      h += '<div class="empty-state"><span class="mi">psychology</span><p>Nog geen analyses.</p></div>';
    } else {
      data.forEach(function(a) {
        h += '<div class="analysis-card"><h3>' + esc(a.type) + ' <span style="font-size:11px;color:var(--tx3)">' + fmtDateTime(a.created_at) + '</span></h3>';
        h += '<div class="analysis-body">' + esc(a.result_text) + '</div></div>';
      });
    }
    app.innerHTML = h;
  });
}

  h += '<span class="legal-flow-item" style="background:rgba(236,72,153,.15);color:#ec4899" onclick="scrollToProc(\'hoger_beroep\')">Hoger beroep</span>';
  h += '<span class="legal-flow-arrow">&rarr;</span>';

  h += '<span class="legal-flow-item" style="background:rgba(249,115,22,.15);color:#f97316" onclick="scrollToProc(\'voorlopige_voorziening\')">Voorlopige voorziening</span>';

  h += '<div class="legal-flow" style="margin-top:8px;margin-bottom:24px">';
  h += '<span style="font-size:12px;color:var(--tx3);margin-right:4px">Strafrecht:</span>';
  h += '<span class="legal-flow-item" style="background:rgba(239,68,68,.15);color:#ef4444" onclick="scrollToProc(\'aangifte\')">Aangifte</span>';
  h += '<span class="legal-flow-arrow">&rarr; bij sepot &rarr;</span>';
  h += '<span class="legal-flow-item" style="background:rgba(190,24,93,.15);color:#be185d" onclick="scrollToProc(\'art12\')">Art. 12 Sv-klacht</span>';

  // Filter bar
  h += '<div class="legal-filter-bar">';

  h += '<button class="legal-filter-btn' + (_procFilter==='bestuursrecht'?' active':'') + '" onclick="filterProcs(\'bestuursrecht\')"><span class="mi mi-sm">account_balance</span> Bestuursrecht</button>';
  h += '<button class="legal-filter-btn' + (_procFilter==='civiel_recht'?' active':'') + '" onclick="filterProcs(\'civiel_recht\')"><span class="mi mi-sm">description</span> Civiel recht</button>';

  // Placeholder for procedure cards
  h += '<div id="procList"><div class="loading"><div class="spinner"></div></div></div>';
